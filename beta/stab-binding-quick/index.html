<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三眼綴訂 快速版（試驗）</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@500;700&family=IBM+Plex+Sans:wght@600;700&display=swap">
<style>
:root{--paper:#efe9d8;--paper-2:#f7f3e8;--ink:#1b1714;--muted:#5e5549;--red:#d2392b;--yellow:#f4e64b;--blue:#3a8fd6;--green:#2f8f4e;--thread:var(--red);
 --f-display:"Huninn","jf-openhuninn","Noto Sans TC",sans-serif;--f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--f-en:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background-color:var(--paper);background-image:radial-gradient(rgba(27,23,20,.10) 1.1px,transparent 1.5px);background-size:7px 7px;color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:16px;line-height:1.6;
 padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.06em;margin:0}
b,strong{font-weight:700}
.btn{font:inherit;font-weight:700;font-size:16px;border:2.5px solid var(--ink);background:var(--paper-2);color:var(--ink);border-radius:0;padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:3px 3px 0 var(--ink);text-decoration:none;transition:transform .08s,box-shadow .08s;touch-action:manipulation}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.big{font-size:21px;padding:12px 30px;background:var(--red);color:var(--paper-2)}
.btn.y{background:var(--yellow)}
.btn.k{background:var(--ink);color:var(--yellow)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.top{display:flex;align-items:center;gap:10px}
.top a.back{font-weight:700;font-size:14px;color:var(--ink);text-decoration:none;border:2px solid var(--ink);padding:2px 10px;background:var(--paper-2)}
.top .sp{flex:1}
.snd{font:inherit;font-size:14px;font-weight:700;border:2px solid var(--ink);background:var(--paper-2);padding:2px 10px;cursor:pointer}
.beta{font-family:var(--f-en);font-weight:700;font-size:11px;letter-spacing:.1em;background:var(--ink);color:var(--yellow);padding:1px 7px}
.intro{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.intro .hero{display:flex;align-items:flex-end;gap:8px}
.intro .hero img{width:118px;height:auto;flex:none}
.kicker{font-family:var(--f-en);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--red)}
.intro h1{font-size:clamp(36px,10.5vw,54px);line-height:1.1;display:inline;background:linear-gradient(var(--yellow),var(--yellow)) no-repeat 0 .55em/100% .5em}
.intro p.lead{margin:0;font-size:18px;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:2px solid var(--ink);padding:1px 10px;font-weight:700;font-size:14px;background:var(--paper-2)}
.intro .go{align-self:stretch;font-size:24px;padding:16px}
.small{font-size:13.5px;color:var(--muted);margin:0}
.small a{color:var(--ink)}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bd{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);text-align:center;line-height:1.3}
.bd i{width:44px;height:44px;border-radius:50%;border:2.5px dashed #9b917f;display:grid;place-items:center;background:var(--paper-2);font-style:normal;transition:transform .3s}
.bd i svg{width:24px;height:24px;opacity:.35}
.bd.now{color:var(--ink)} .bd.now i{border:3px solid var(--ink);background:#fff;animation:pulse 1.4s infinite}
.bd.now i svg{opacity:1}
.bd.got{color:var(--ink)} .bd.got i{border:3px solid var(--ink);background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}
.bd.got i svg{opacity:1}
.bd.pop i{animation:pop .6s}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.task{background:var(--paper-2);border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px 12px}
.task small{display:block;font-size:13px;color:var(--red);font-weight:700}
.task .do{font-size:20px;font-weight:700;line-height:1.4}
.play{position:relative;background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:14px;min-height:300px;user-select:none;-webkit-user-select:none}
.coach{display:flex;align-items:flex-end;gap:6px;min-height:84px}
.coach img{width:70px;height:auto;flex:none}
.coach img.hop{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-14px)}}
.msg{flex:1;background:#fff;border:2.5px solid var(--ink);padding:8px 12px;font-size:15.5px;position:relative}
.msg:before{content:"";position:absolute;left:-12px;bottom:14px;border:6px solid transparent;border-right:8px solid var(--ink)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 12px max(12px,env(safe-area-inset-bottom,0px));pointer-events:none}
.sheet .in{pointer-events:auto;width:min(100%,540px);background:var(--paper-2);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px;display:flex;gap:12px;align-items:center;animation:up .35s ease-out}
.sheet .medal{flex:none;width:62px;height:62px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);display:grid;place-items:center;animation:pop .6s}
.sheet .medal svg{width:32px;height:32px}
.sheet .t{font-family:var(--f-display);font-size:20px}
.sheet p{margin:2px 0 8px;font-size:14.5px;line-height:1.5}
@keyframes up{from{transform:translateY(40px);opacity:0}}
/* 共用小遊戲元件 */
.slots{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.slot{border:2.5px dashed #9b917f;min-height:42px;display:flex;align-items:center;gap:8px;padding:4px 10px;font-weight:700;font-size:15px;color:var(--muted)}
.slot b{flex:none;width:26px;height:26px;border-radius:50%;background:#e9e3d2;display:grid;place-items:center;font-size:14px}
.slot.next{border-color:var(--red);background:#fff7d6}
.slot.on{border-style:solid;border-color:var(--ink);background:var(--yellow);color:var(--ink);animation:pop .4s}
.slot.on b{background:var(--ink);color:var(--yellow)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool .btn{font-size:15px;text-align:left}
.stack{position:relative;height:190px;margin:4px auto 14px;max-width:360px;touch-action:pan-y}
.card{position:absolute;inset:0;background:var(--paper-2);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center;transition:transform .35s ease,opacity .35s;touch-action:none;cursor:grab}
.card.under{transform:translate(6px,6px) rotate(2deg);background:#ece5d2;box-shadow:none}
.card .ic{width:64px;height:64px}
.card .ic svg{width:100%;height:100%}
.card .nm{font-size:21px;font-weight:700;line-height:1.35}
.card .sub{font-size:14px;color:var(--muted)}
.card .cnt{position:absolute;top:6px;right:10px;font-family:var(--f-en);font-weight:700;font-size:13px;color:var(--muted)}
.bins{display:grid;gap:8px}
.bins .btn{font-size:16px;padding:10px 8px;line-height:1.35}
.bins.two{grid-template-columns:1fr 1fr}
.bins.two .btn{font-size:19px;padding:14px 8px}
.swipehint{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:-8px;margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tile{font:inherit;background:var(--paper-2);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:14px;font-weight:700;line-height:1.3;position:relative}
.tile svg{width:46px;height:46px}
.tile.yes{background:var(--yellow)}
.tile.yes:after{content:"✓";position:absolute;top:2px;right:6px;color:var(--green);font-size:20px}
.tile.no{opacity:.45;text-decoration:line-through}
.hunt{position:relative;height:280px;background:#efe3c8;border:3px solid var(--ink);overflow:hidden;touch-action:manipulation}
.hunt .bug{position:absolute;width:52px;height:52px;border:0;background:none;padding:0;cursor:pointer;transition:left 1.1s ease-in-out,top 1.1s ease-in-out}
.hunt .bug svg{width:100%;height:100%}
.hunt .bug.dead{transition:transform .3s,opacity .3s;transform:scale(1.6);opacity:0;pointer-events:none}
.flips{display:grid;gap:10px}
.flip{font:inherit;border:0;background:none;padding:0;perspective:900px;cursor:pointer;min-height:104px;display:block;width:100%}
.flip .fc{position:relative;width:100%;min-height:104px;transition:transform .6s;transform-style:preserve-3d}
.flip.on .fc{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:10px 12px;display:flex;align-items:center;gap:10px;text-align:left;font-size:15.5px}
.flip .fa{background:var(--paper-2);font-weight:700}
.flip .fa:after{content:"點我翻開 ↻";position:absolute;right:8px;bottom:4px;font-size:12px;color:var(--red)}
.flip .fb{background:var(--yellow);transform:rotateY(180deg)}
.flip svg{width:48px;height:48px;flex:none}
.quiz .q{font-size:18px;font-weight:700;line-height:1.5;margin-bottom:10px}
.quiz .opts{display:flex;flex-direction:column;gap:8px}
.quiz .opts .btn{justify-content:flex-start;text-align:left;font-size:15.5px;line-height:1.45}
.quiz .opts .btn.ok{background:var(--yellow)}
.quiz .opts .btn.no{opacity:.5;text-decoration:line-through}
.quiz .qn{font-family:var(--f-en);font-weight:700;font-size:13px;color:var(--red)}
.fin{display:flex;flex-direction:column;gap:14px}
.fin .head{text-align:center}
.fin .head h2{font-size:38px;display:inline;background:linear-gradient(var(--yellow),var(--yellow)) no-repeat 0 .55em/100% .5em}
.box{background:var(--paper-2);border:2.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:14px}
.box h3{font-size:22px;margin-bottom:8px}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.faces button{font:inherit;background:#fff;border:2.5px solid var(--ink);padding:6px 0 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700}
.faces button span{font-size:30px;line-height:1.2}
.faces button[aria-pressed=true]{background:var(--yellow);box-shadow:inset 0 0 0 2px var(--ink)}
textarea,input[type=text]{font:inherit;font-size:16px;border:2.5px solid var(--ink);padding:8px 10px;background:#fff;width:100%;border-radius:0}
textarea{min-height:70px;resize:vertical}
.consent{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.5;text-align:left}
.consent input{margin-top:4px;width:18px;height:18px;flex:none}
.certimg{width:100%;height:auto;display:block;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:#fff;-webkit-touch-callout:default}
.col{display:flex;flex-direction:column;gap:10px}
.links{display:flex;flex-wrap:wrap;gap:10px}
.rec{background:#fff;border:2px solid var(--ink);padding:8px 10px;font-size:14px}
.rec ul{margin:4px 0 0;padding-left:1.2em}
footer{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;margin-top:10px}
.bk{position:relative;max-width:520px;margin:0 auto;aspect-ratio:480/400;perspective:1200px;touch-action:pan-y}
#book{width:100%;height:100%;display:block;transition:transform .28s ease-in}#book.flipping{transform:rotateY(90deg)}
.side-tag{position:absolute;top:6px;left:6px;font-weight:700;font-size:14px;color:var(--paper-2);background:var(--red);padding:1px 10px;border:2px solid var(--ink)}
.side-tag.back{background:var(--ink);left:auto;right:6px}
.hit{cursor:pointer}.hring{fill:transparent;stroke:transparent;stroke-width:4}.hit.lit .hring{stroke:var(--yellow);stroke-width:7;stroke-dasharray:8 6;animation:spin3 4s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin3{to{transform:rotate(360deg)}}
.drawn{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}
.play.bkp{padding:8px}</style>
</head>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const ico = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${CFG.icons[k]}</svg>`;

// ---------- 音效 ----------
let AC=null, soundOn=true;
try { soundOn = localStorage.getItem('archi_sound') !== '0'; } catch(e){}
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,t0,dur,type='sine',vol=.18){ const a=ac(); if(!a||!soundOn) return; const o=a.createOscillator(),g=a.createGain(); o.type=type; o.frequency.value=f; const t=a.currentTime+t0; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05); }
let NB=null; function noiseBuf(){ const a=ac(); if(!a) return null; if(!NB){ NB=a.createBuffer(1,a.sampleRate,a.sampleRate); const d=NB.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } return NB; }
function noise(dur,freq,q=1,vol=.25,type='bandpass'){ const a=ac(); if(!a||!soundOn) return; const s=a.createBufferSource(); s.buffer=noiseBuf(); const f=a.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q; const g=a.createGain(); const t=a.currentTime; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t+dur); }
const SFX = {
 pop(){ tone(660,0,.12,'triangle',.2); tone(990,.06,.14,'triangle',.16); },
 ding(){ tone(880,0,.25,'sine',.2); tone(1320,.1,.35,'sine',.16); },
 badge(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.3,'triangle',.18)); },
 swish(){ noise(.12,2600,.9,.2); },
 squash(){ noise(.08,900,1.5,.35); tone(180,0,.12,'square',.08); },
 flip(){ noise(.15,4000,.7,.15); },
 knot(){ tone(220,0,.15,'triangle',.25); tone(330,.08,.15,'triangle',.2); },
 snip(){ noise(.04,5000,2,.4); setTimeout(()=>noise(.04,5000,2,.35),70); },
 press(){ tone(110,0,.25,'sine',.3); },
 fanfare(){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.13,.4,'triangle',.2)); tone(1568,.8,.7,'sine',.12); },
 nudge(){ tone(330,0,.12,'sine',.12); tone(262,.1,.16,'sine',.1); }
};
function buzz(p){ try{ if(soundOn && navigator.vibrate) navigator.vibrate(p); }catch(e){} }
function setSound(on){ soundOn=on; $('sndBtn').textContent = on?'🔊 音效開':'🔇 音效關'; $('sndBtn').setAttribute('aria-pressed',on); try{localStorage.setItem('archi_sound',on?'1':'0')}catch(e){} }
$('sndBtn').onclick = () => { setSound(!soundOn); if(soundOn) SFX.pop(); };

// ---------- 遊戲流程 ----------
let S;
function coach(kind, html){ const im=$('coachImg'); im.src=CFG.ch[kind]||CFG.ch.idle; im.classList.remove('hop'); void im.offsetWidth; if(kind==='good'||kind==='done') im.classList.add('hop'); $('msg').innerHTML=html; }
function shakeEl(n){ if(!n) return; n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake'); }
function badgesHTML(target, upto, now){ target.innerHTML = CFG.steps.map((s,k)=>`<div class="bd ${k<upto?'got':''} ${k===now?'now':''}" id="${target.id}_${k}"><i>${ico(s.key)}</i>${s.badge}</div>`).join(''); }
function poke(){ clearTimeout(S.idleT); S.idleT=setTimeout(()=>{ if(!S.busy){ coach('miss','💡 '+CFG.steps[S.i].hint); SFX.nudge(); } }, 8000); }
const G = {
 get play(){ return $('play'); },
 ok(msg){ SFX.ding(); buzz(25); coach('good', msg); poke(); },
 tick(msg){ SFX.pop(); buzz(12); if(msg) coach('good', msg); poke(); },
 no(msg, node){ SFX.nudge(); buzz([20,40,20]); coach('miss', msg); shakeEl(node); poke(); },

};
function startStep(){
 const s=CFG.steps[S.i]; S.busy=false;
 badgesHTML($('badges'), S.i, S.i);
 $('taskSub').textContent = `第 ${S.i+1} 步／共 ${CFG.steps.length} 步 · ${s.name}`;
 $('taskDo').innerHTML = s.do;
 $('play').innerHTML=''; $('play').className='play';
 coach('idle', S.i===0 ? CFG.firstSay : `拿到 ${CFG.steps[S.i-1].badge}！下一步：${s.name}。`);
 SETUP[s.key](G); poke();
}
function stepDone(){
 const s=CFG.steps[S.i], last = S.i===CFG.steps.length-1;
 window.ARCHI && ARCHI.log('clear', {level:S.i+1, mode:'快速版', secs:Math.round((Date.now()-S.t0)/1000)});
 SFX.badge(); buzz([30,60,30]);
 badgesHTML($('badges'), S.i+1, -1); $('badges_'+S.i).classList.add('pop');
 $('sheet').hidden=false;
 $('sheetIn').innerHTML = `<div class="medal">${ico(s.key)}</div><div style="flex:1;min-width:0"><div class="t">獲得 ${s.badge}！</div><p>${s.fact}</p><button class="btn ${last?'big':'y'}" id="nextBtn">${last?'完成任務 ▶':'下一步 ▶'}</button></div>`;
 $('nextBtn').focus({preventScroll:true});
 $('nextBtn').onclick = () => { $('sheet').hidden=true; SFX.pop(); if(last) finale(); else { S.i++; startStep(); window.scrollTo({top:0,behavior:'smooth'}); } };
}
function finale(){
 const secs=Math.round((Date.now()-S.t0)/1000);
 try{ [].concat(CFG.stamp||[]).forEach(k=>localStorage.setItem(k,'1')); }catch(e){}
 window.ARCHI && ARCHI.log('finish', {mode:'快速版', secs, level:CFG.steps.length});
 SFX.fanfare(); buzz([40,60,40,60,80]);
 $('game').hidden=true; $('fin').hidden=false; window.scrollTo(0,0);
 badgesHTML($('badges2'), CFG.steps.length, -1);
 $('recList').innerHTML = `<b>${CFG.recTitle}</b><ul>${CFG.recItems.map(x=>`<li>${x}</li>`).join('')}</ul><p class="small" style="margin-top:6px">花了 ${Math.floor(secs/60)} 分 ${secs%60} 秒。${CFG.recMore}</p>`;
}

// ---------- 共用小遊戲 ----------
const H = {
 // 照順序點：items 是正確順序
 order(G, items, o={}){
  const n=items.length; let k=0;
  G.play.insertAdjacentHTML('beforeend', `${o.lead?`<p style="margin:0 0 8px">${o.lead}</p>`:''}<div class="slots">${items.map((_,i)=>`<div class="slot${i?'':' next'}" id="sl${i}"><b>${i+1}</b><span>${i?'':'？'}</span></div>`).join('')}</div><div class="pool">${shuffle(items.map((t,i)=>({t,i}))).map(p=>`<button class="btn" data-o="${p.i}">${p.t}</button>`).join('')}</div>`);
  G.play.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
   if(+b.dataset.o!==k){ G.no(o.miss?o.miss(k):'還不是這一個喔，想想看哪個要先做？', b); return; }
   const sl=$('sl'+k); sl.classList.remove('next'); sl.classList.add('on'); sl.querySelector('span').textContent=items[k]; b.remove(); k++;
   if(k<n){ $('sl'+k).classList.add('next'); $('sl'+k).querySelector('span').textContent='？'; G.tick(o.say?o.say(k-1):`對！第 ${k} 個是「${items[k-1]}」。`); }
   else { G.ok(o.end||'順序全對！'); G.done(); }
  });
 },
 // 分類卡片：cards [{t, sub, ic, ans, why}]，bins [標籤]；兩個分類時可左右滑
 sort(G, cards, bins, o={}){
  let k=0; const two=bins.length===2;
  G.play.insertAdjacentHTML('beforeend', `${o.lead?`<p style="margin:0 0 6px">${o.lead}</p>`:''}<div class="stack" id="stk"></div>${two?`<div class="swipehint"><span>← 滑向「${bins[0]}」</span><span>滑向「${bins[1]}」→</span></div>`:''}<div class="bins ${two?'two':''}">${bins.map((b,i)=>`<button class="btn ${two&&i===1?'k':two?'y':''}" data-b="${i}">${b}</button>`).join('')}</div>`);
  const stk=$('stk');
  function show(){
   stk.innerHTML = (k+1<cards.length?`<div class="card under"></div>`:'') + `<div class="card" id="cur"><span class="cnt">${k+1} / ${cards.length}</span>${cards[k].ic?`<div class="ic">${cards[k].ic}</div>`:''}<div class="nm">${cards[k].t}</div>${cards[k].sub?`<div class="sub">${cards[k].sub}</div>`:''}</div>`;
   if(two) drag($('cur'));
  }
  function answer(i){
   const c=cards[k], cur=$('cur'); if(!cur||cur.dataset.gone) return;
   if(i!==c.ans){ cur.style.transform=''; G.no(c.miss||`「${c.t}」不是「${bins[i]}」喔，再想一想！`, cur); return; }
   cur.dataset.gone=1; const dx = two ? (i? 1:-1) : 0; cur.style.transform=`translate(${dx*420}px, ${two?-40:-260}px) rotate(${dx*24}deg)`; cur.style.opacity=0;
   k++; G.sfx.swish(); if(k<cards.length){ G.tick(c.why?`<b>${c.t}</b>：${c.why}`:null); setTimeout(show,260); } else { G.ok(c.why?`<b>${c.t}</b>：${c.why}`:'全部分好了！'); setTimeout(()=>{stk.innerHTML='';},300); G.done(); }
  }
  function drag(n){ let x0=null,dx=0;
   n.addEventListener('pointerdown',e=>{ x0=e.clientX; dx=0; n.style.transition='none'; try{n.setPointerCapture(e.pointerId)}catch(_){} });
   n.addEventListener('pointermove',e=>{ if(x0===null) return; dx=e.clientX-x0; n.style.transform=`translateX(${dx}px) rotate(${dx/14}deg)`; });
   const up=()=>{ if(x0===null) return; x0=null; n.style.transition=''; if(Math.abs(dx)>80) answer(dx>0?1:0); else n.style.transform=''; };
   n.addEventListener('pointerup',up); n.addEventListener('pointercancel',up);
  }
  G.play.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>answer(+b.dataset.b));
  show();
 },
 // 挑出正確的：opts [{t, ic, ok, why}]
 pick(G, opts, o={}){
  const need=opts.filter(x=>x.ok).length; let got=0;
  G.play.insertAdjacentHTML('beforeend', `${o.top||''}<div class="tiles">${shuffle(opts.map((x,i)=>({x,i}))).map(p=>`<button class="tile" data-p="${p.i}">${p.x.ic||''}<span>${p.x.t}</span></button>`).join('')}</div>${o.after||''}`);
  G.play.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ const x=opts[+b.dataset.p]; if(b.disabled) return; b.disabled=true;
   if(!x.ok){ b.classList.add('no'); G.no(`<b>${x.t}</b>不行喔：${x.why}。`, b); return; }
   b.classList.add('yes'); got++; o.onPick && o.onPick(x);
   if(got<need) G.tick(`<b>${x.t}</b>：${x.why}。還差 ${need-got} 樣！`); else { G.ok(`<b>${x.t}</b>：${x.why}。`); G.play.querySelectorAll('[data-p]').forEach(t=>t.disabled=true); G.done(o.end); }
  });
 },
 // 點掉亂跑的蟲
 hunt(G, n, icon, o={}){
  G.play.insertAdjacentHTML('beforeend', `${o.lead?`<p style="margin:0 0 8px">${o.lead}</p>`:''}<div class="hunt" id="hunt">${o.bg||''}</div>`);
  const box=$('hunt'); let left=n; const bugs=[];
  for(let i=0;i<n;i++){ const b=document.createElement('button'); b.className='bug'; b.setAttribute('aria-label','蟲'); b.innerHTML=icon; box.appendChild(b); bugs.push(b);
   b.onclick=()=>{ if(b.classList.contains('dead')) return; b.classList.add('dead'); left--; G.sfx.squash(); G.buzz(30); if(left) coach('good',`抓到了！還剩 ${left} 隻。`); else { G.ok(o.end||'全部清乾淨！'); clearInterval(iv); G.done(); } }; }
  const move=()=>bugs.forEach(b=>{ if(b.classList.contains('dead')) return; b.style.left=(4+Math.random()*78)+'%'; b.style.top=(4+Math.random()*72)+'%'; b.style.transform=`rotate(${Math.random()*360}deg)`; });
  move(); const iv=setInterval(()=>{ if(!document.body.contains(box)) return clearInterval(iv); move(); }, 1200);
 },
 // 翻翻卡
 flips(G, cards, o={}){
  let left=cards.length;
  G.play.insertAdjacentHTML('beforeend', `${o.lead?`<p style="margin:0 0 8px">${o.lead}</p>`:''}<div class="flips">${cards.map((c,i)=>`<button class="flip" data-f="${i}"><div class="fc"><div class="fa">${c.ic||''}<span>${c.q}</span></div><div class="fb">${c.ic||''}<span>${c.a}</span></div></div></button>`).join('')}</div>`);
  G.play.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ if(b.classList.contains('on')) return; b.classList.add('on'); G.sfx.flip(); left--; const c=cards[+b.dataset.f];
   if(left) G.tick(c.say||`翻開了！還有 ${left} 張。`); else { G.ok(o.end||'全部翻開了！'); G.done(); } });
 },
 // 選擇題：答錯只說再想想，可以再選
 quiz(G, qs, o={}){
  let k=0;
  const show=()=>{ const q=qs[k]; G.play.innerHTML=`<div class="quiz"><div class="qn">第 ${k+1} 題／共 ${qs.length} 題</div><div class="q">${q.q}</div><div class="opts">${q.o.map((t,i)=>`<button class="btn" data-q="${i}">${'ABCD'[i]}　${t}</button>`).join('')}</div></div>`;
   G.play.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.q; if(b.disabled) return;
    if(i!==q.a){ b.disabled=true; b.classList.add('no'); G.no('再想一想，換一個答案試試！', b); return; }
    b.classList.add('ok'); G.play.querySelectorAll('[data-q]').forEach(x=>x.disabled=true); k++;
    if(k<qs.length){ G.ok('答對了！'+q.e); setTimeout(show, 1800); } else { G.ok('答對了！'+q.e); G.done(); } }); };
  show();
 }
};

  if(window.ARCHI&&ARCHI.on){ const sh=$('share').checked&&$('nm').value.trim(); if(sh) ARCHI.share('cert_name',sh).then(ok=>{ if(ok){ $('sentMsg').textContent='已匿名送出，歡迎入隊！'; $('sentMsg').hidden=false; } }); } }, 'image/png'); }
};

\"255\" y=\"248\" font-size=\"23\" fill=\"#22201e\" text-anchor=\"middle\" font-family=\"LXGW WenKai TC, Kaiti TC, KaiTi, serif\">卷</text><text x=\"165\" y=\"112\" font-size=\"15\" fill=\"#2a2522\" text-anchor=\"middle\" font-family=\"LXGW WenKai TC, Kaiti TC, KaiTi, serif\">假</text><text x=\"165\" y=\"131\" font-size=\"15\" fill=\"#2a2522\" text-anchor=\"middle\" font-family=\"LXGW WenKai TC, Kaiti TC, KaiTi, serif\">文</text><text x=\"165\" y=\"150\" font-size=\"15\" fill=\"#2a2522\" text-anchor=\"middle\" font-family=\"LXGW WenKai TC, Kaiti TC, KaiTi, serif\">件</text><g transform=\"rotate(-10 112 214)\"><rect x=\"76\" y=\"194\" width=\"74\" height=\"40\" fill=\"none\" stroke=\"#3a6fc0\" stroke-width=\"2.5\" stroke-opacity=\".85\"/><text x=\"113\" y=\"221\" font-size=\"17\" fill=\"#3a6fc0\" fill-opacity=\".85\" text-anchor=\"middle\" font-family=\"Noto Serif TC, serif\" font-weight=\"700\">練習用</text></g><text x=\"76\" y=\"260\" font-size=\"12\" font-family=\"Courier New, monospace\" fill=\"#5b57b0\" fill-opacity=\".85\">BOX 03-06</text><text x=\"318\" y=\"258\" font-size=\"16\" fill=\"#141210\" transform=\"rotate(-3 318 258)\" font-family=\"LXGW WenKai TC, Kaiti TC, KaiTi, serif\" font-weight=\"700\">No. 000-3</text></g>\n            <rect x=\"32\" y=\"330\" width=\"418\" height=\"16\" fill=\"#f7f3e8\" stroke=\"#1b1714\" stroke-width=\"2\"/>\n            <g stroke=\"#1b1714\" stroke-opacity=\".3\"><line x1=\"34\" y1=\"335\" x2=\"448\" y2=\"335\"/><line x1=\"34\" y1=\"340\" x2=\"448\" y2=\"340\"/></g>\n            <g id=\"holes\"></g>\n            <g id=\"otherThread\" opacity=\".6\"></g>\n            <g id=\"thread\"></g>\n            <g id=\"marks\"></g>\n            <g id=\"hits\"></g>\n          </g>\n          <g id=\"labels\" font-family=\"Noto Sans TC, sans-serif\" font-size=\"18\" font-weight=\"900\" fill=\"#1b1714\"></g>\n        </svg>";
const W=480, HY=292, X={left:130,mid:240,right:350}, NAME={left:'左孔',mid:'中孔',right:'右孔'};
const NS='http://www.w3.org/2000/svg';
let B;
function el(tag,a,p){ const e=document.createElementNS(NS,tag); for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e; }
CFG.onStart = () => { B={view:'front',punched:{},segs:[],mark:null,needle:null,knot:0,i:0,drawn:0}; };
function mount(G, lit, onHit, flipBtn){
 G.play.className='play bkp';
 G.play.innerHTML = `<div class="bk" id="bk">${BOOK}<span class="side-tag" id="sideTag">封面</span></div>${flipBtn?'<div style="text-align:center;margin-top:8px"><button class="btn big" id="flipBtn">翻面 ↻</button></div>':''}`;
 render(lit);
 G.play.querySelector('#hits').addEventListener('click', e=>{ const g=e.target.closest('.hit'); if(g) onHit(g.dataset.t); });
}
function render(lit){
 const back=B.view==='back', $b=id=>document.getElementById(id);
 $b('mirror').setAttribute('transform', back?`translate(${W} 0) scale(-1 1)`:'');
 $b('cover').setAttribute('fill', back?'#e2d6bd':'#f5f3ee'); $b('coverFrame').setAttribute('display', back?'none':'inline');
 const tag=$b('sideTag'); tag.textContent=back?'封底':'封面'; tag.className='side-tag'+(back?' back':'');
 const lx=x=>back?W-x:x, holes=$b('holes'), labels=$b('labels'); holes.innerHTML=''; labels.innerHTML='';
 for(const k of ['left','mid','right']){ if(B.punched[k]) el('circle',{cx:X[k],cy:HY,r:6,fill:'#1b1714'},holes); else el('path',{d:`M${X[k]-7} ${HY}h14M${X[k]} ${HY-7}v14`,stroke:'#1b1714','stroke-width':1.6,'stroke-opacity':.55},holes);
  el('text',{x:lx(X[k]),y:HY+31,'text-anchor':'middle'},labels).textContent={left:'左',mid:'中',right:'右'}[k]; }
 const me=back?'back':'front', th=$b('thread'), ot=$b('otherThread'); th.innerHTML=''; ot.innerHTML='';
 B.segs.forEach((s,idx)=>{ if(s.side===me){ el('path',{d:s.d,stroke:'#1b1714','stroke-width':9,'stroke-linecap':'round',fill:'none'},th); const p=el('path',{d:s.d,stroke:idx===B.segs.length-1&&B.i<=7?'var(--thread)':'#fbf8f1','stroke-width':5.5,'stroke-linecap':'round',fill:'none',pathLength:1},th); if(idx>=B.drawn) p.classList.add('drawn'); }
  else el('path',{d:s.d,stroke:'#1b1714','stroke-width':3,'stroke-dasharray':'7 6',fill:'none'},ot); });
 B.drawn=B.segs.length;
 const line=(d,c,w)=>{ el('path',{d,stroke:'#1b1714','stroke-width':w+3.5,'stroke-linecap':'round',fill:'none'},th); el('path',{d,stroke:c,'stroke-width':w,'stroke-linecap':'round',fill:'none'},th); };
 const mx=X.mid;
 if(back){ if(B.knot===0){ if(B.i>=4) line(`M${mx} ${HY} q-30 -20 -36 -70`,'#fbf8f1',4.5); if(B.i>=7) line(`M${mx} ${HY} q30 -20 36 -70`,'var(--thread)',4.5); }
  else if(B.knot<=3){ const len=B.knot===3?16:72; for(const dir of [-1,1]) line(`M${mx} ${HY-8} l${dir*len*.35} ${-len}`,'var(--thread)',4); const r=B.knot===1?8:11; el('circle',{cx:mx,cy:HY-4,r,fill:'none',stroke:'#1b1714','stroke-width':7.5},th); el('circle',{cx:mx,cy:HY-4,r,fill:'none',stroke:'var(--thread)','stroke-width':4},th); }
  else el('circle',{cx:mx,cy:HY,r:7,fill:'#fbf8f1',stroke:'#1b1714','stroke-width':2},th); }
 if(B.needle && B.i<=7 && B.needle.side===me){ const x=X[B.needle.at]; el('path',{d:`M${x+4} ${HY-3} L${x+52} ${HY-58}`,stroke:'#1b1714','stroke-width':3,'stroke-linecap':'round'},th); el('ellipse',{cx:x+54,cy:HY-60,rx:2.4,ry:5,transform:`rotate(42 ${x+54} ${HY-60})`,fill:'none',stroke:'#1b1714','stroke-width':2},th); }
 const marks=$b('marks'); marks.innerHTML='';
 if(B.mark && B.mark.side===me){ const x=X[B.mark.at]; el('circle',{cx:x,cy:HY,r:13,fill:'#fff',stroke:'var(--thread)','stroke-width':3.5},marks); if(B.mark.type==='out') el('circle',{cx:x,cy:HY,r:4.5,fill:'var(--thread)'},marks); else el('path',{d:`M${x-7} ${HY-7}l14 14M${x+7} ${HY-7}l-14 14`,stroke:'var(--thread)','stroke-width':3.2},marks); }
 const hits=$b('hits'); hits.innerHTML='';
 for(const k of ['left','mid','right']){ const g=el('g',{class:'hit'+((lit||[]).includes(k)?' lit':''),'data-t':k},hits); el('circle',{class:'hring',cx:X[k],cy:HY,r:24},g); el('circle',{cx:X[k],cy:HY,r:34,fill:'transparent'},g); }
}
function flipAnim(after){ const b=document.getElementById('book'); b.classList.add('flipping'); SFX.flip(); setTimeout(()=>{ B.view=B.view==='front'?'back':'front'; after(); b.classList.remove('flipping'); },280); }
const SEQ=['mid','left','right','mid'];
var SETUP = {
 awl(G){ mount(G, ['left','mid','right'], t=>{ if(B.punched[t]){ G.no('這個孔已經鑽好了，換一個記號！'); return; } B.punched[t]=true; G.sfx.press(); G.buzz(30); const n=3-Object.keys(B.punched).length;
   render(['left','mid','right'].filter(k=>!B.punched[k])); if(n) G.tick(`鑽好${NAME[t]}！還有 ${n} 個。`); else G.done('3 個孔都鑽好了！'); }); },
 needle(G){ let k=0; const add=(side,f,t)=>B.segs.push({side,d:`M${X[f]} ${HY}H${X[t]}`});
  const step=()=>{ B.i=3+k; render([SEQ[k]]); };
  mount(G, [SEQ[0]], t=>{ if(t!==SEQ[k]){ G.no(`不是${NAME[t]}喔！口訣：<b>中上、左下、右上、中下</b>，現在要點<b>${NAME[SEQ[k]]}</b>。`); return; }
   if(k===0){ B.mark={at:'mid',type:'out',side:'front'}; B.needle={side:'front',at:'mid'}; }
   if(k===1){ add('front','mid','left'); B.mark={at:'left',type:'in',side:'front'}; B.needle={side:'back',at:'left'}; }
   if(k===2){ add('back','left','right'); B.mark={at:'right',type:'out',side:'front'}; B.needle={side:'front',at:'right'}; }
   if(k===3){ add('front','right','mid'); B.mark={at:'mid',type:'in',side:'front'}; B.needle={side:'back',at:'mid'}; }
   G.sfx.swish(); k++; B.i=3+k;
   if(k<4){ render([SEQ[k]]); G.tick(['中上：針從中孔穿出來！下一個：左下。','左下：從左孔穿進去！下一個：右上。','右上：在封底拉長線，從右孔穿出來！最後：中下。'][k-1]); } else { render([]); G.done('中下：從中孔穿進去，穿針完成！'); } });
 },
 flip(G){ B.i=7; mount(G, [], ()=>{}, true); let x0=null;
  const go=()=>{ if(B.view==='back') return; flipAnim(()=>{ B.mark=null; render([]); G.done('翻到封底了！'); }); };
  $('flipBtn').onclick=go; const bk=$('bk');
  bk.addEventListener('pointerdown',e=>{x0=e.clientX;}); bk.addEventListener('pointerup',e=>{ if(x0!==null&&Math.abs(e.clientX-x0)>50) go(); x0=null; }); },
 knot(G){ B.i=8; let n=0; mount(G, ['mid'], t=>{ if(t!=='mid'){ G.no('打結要在<b>中孔</b>喔！'); return; } n++; B.knot=n;
   if(n<3){ G.sfx.knot(); G.buzz(25); render(['mid']); G.tick(n===1?'打好第一個結！再點一次打第二個結。':'平結完成！再點一次，拉緊剪線。'); } else { G.sfx.snip(); G.buzz(40); render([]); G.done('剪好了！'); } }); },
 hide(G){ B.i=11; mount(G, ['mid'], t=>{ if(t!=='mid'){ G.no('線頭要塞進<b>中孔</b>！'); return; } B.knot=4; render([]); G.sfx.press();
   setTimeout(()=>flipAnim(()=>{ render([]); G.done('裝訂完成！翻回封面看看：中→左、右→中兩段線。'); }), 500); }); }
};
