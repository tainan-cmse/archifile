<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>斜槓之路｜箱四 檔案的斜槓人生</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Sans:wght@600;700&display=swap">
<style>
:root{--paper:#efe9d8;--paper-2:#f7f3e8;--ink:#1b1714;--muted:#5e5549;--red:#c8322a;--dred:#6c291f;--yellow:#f3e03b;--grey:#bcb39c;--blue:#3a8fd6;
--f:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--en:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background-color:var(--paper);background-image:radial-gradient(rgba(27,23,20,.10) 1.1px,transparent 1.5px);background-size:7px 7px;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.65;
padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tohome{align-self:flex-start;display:inline-flex;font-weight:700;font-size:14px;color:var(--ink);text-decoration:none;border:2.5px solid var(--ink);background:var(--paper-2);padding:4px 12px;box-shadow:3px 3px 0 var(--ink)}
.titleblock{display:inline-flex;flex-direction:column;align-self:flex-start;gap:2px}
.titleblock h1{margin:0;font-weight:900;font-size:clamp(30px,7vw,56px);line-height:1.1;letter-spacing:.05em;background:linear-gradient(var(--yellow),var(--yellow)) no-repeat .3em .25em/calc(100% - .2em) calc(100% - .1em);padding-right:.2em}
.en{font-family:var(--en);font-weight:700;font-size:14px;letter-spacing:.04em}
.kicker{font-family:var(--en);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.tag{display:inline-block;background:var(--ink);color:var(--yellow);font-weight:900;padding:1px 10px;letter-spacing:.1em;font-size:14px}
.btn{font:inherit;font-weight:900;font-size:16px;border:2.5px solid var(--ink);background:var(--paper-2);color:var(--ink);padding:8px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.big{font-size:20px;padding:10px 26px;background:var(--red);color:var(--paper-2)}
.btn.y{background:var(--yellow)} .btn.k{background:var(--ink);color:var(--yellow)}
.btn:focus-visible,.flip:focus-visible,.piece:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn:disabled{opacity:.4;cursor:default}
.intro{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:26px;align-items:center}
@media(max-width:720px){.intro{grid-template-columns:1fr}.intro .cube{max-width:260px;margin:0 auto}}
.intro p{margin:0;max-width:34em}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{border:2px solid var(--ink);padding:1px 10px;font-weight:700;font-size:14px;background:var(--paper-2)}
.copy{display:flex;flex-direction:column;gap:14px;min-width:0}
header.bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;border-bottom:3px solid var(--ink);padding-bottom:10px}
.prog{margin-left:auto;display:flex;gap:6px}
.prog i{width:34px;height:10px;border:2px solid var(--ink);background:var(--paper-2)}
.prog i.on{background:var(--red)} .prog i.done{background:var(--ink)}
.panel{background:var(--paper-2);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{margin:0;font-weight:900;font-size:clamp(22px,4.5vw,30px);letter-spacing:.05em}
.panel h2 small{display:block;font-size:14px;color:var(--red);letter-spacing:.06em}
.coach{display:grid;grid-template-columns:clamp(80px,20vw,112px) minmax(0,1fr);gap:12px;align-items:end}
.coach img{width:100%;height:auto;display:block;transform-origin:50% 100%}
.coach img.hop{animation:hop .5s ease-out}
@keyframes hop{30%{transform:translateY(-14px) rotate(-4deg)}60%{transform:translateY(0) rotate(2deg)}}
.msg{position:relative;align-self:center;min-height:3.2em;background:var(--paper-2);border:2.5px solid var(--ink);border-left-width:10px;padding:10px 14px}
.msg::before{content:"";position:absolute;left:-17px;bottom:16px;border:8px solid transparent;border-right:9px solid var(--ink)}
.msg.bad{border-left-color:var(--red)} .msg.good{border-left-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.text{margin:0;background:#fff;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:10px 12px}
.text b{color:var(--red)}
/* L1 */
.guess{background:var(--yellow);border:3px solid var(--ink);padding:18px;display:flex;gap:16px;align-items:center}
.guess .ic{width:clamp(48px,12vw,70px);flex:none} .guess p{margin:0;font-weight:900;font-size:clamp(19px,4.6vw,30px);line-height:1.35}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-weight:900;font-size:clamp(18px,4vw,24px)}
.eq .no{color:var(--red);font-size:1.4em} .eq .ic{width:36px;display:inline-block;vertical-align:middle}
/* L2 */
.flips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:720px){.flips{grid-template-columns:1fr}}
.flip{position:relative;min-height:170px;border:3px solid var(--ink);background:var(--paper-2);box-shadow:4px 4px 0 var(--ink);cursor:pointer;padding:0;font:inherit;color:inherit;perspective:900px;text-align:left}
.flip .f,.flip .b{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;gap:8px;backface-visibility:hidden;transition:transform .45s}
.flip .b{transform:rotateY(180deg);background:#fff;align-items:center;text-align:center;justify-content:center}
.flip.open .f{transform:rotateY(-180deg)} .flip.open .b{transform:rotateY(0)}
.flip .qn{width:40px;height:40px;border-radius:50%;background:var(--red);color:var(--paper-2);font-family:var(--en);font-weight:700;font-size:18px;display:grid;place-items:center}
.flip .f p{margin:0;font-weight:900;font-size:18px;line-height:1.45}
.flip .f em{margin-top:auto;font-style:normal;font-weight:900;color:var(--red);font-size:14px;text-align:right}
.flip .b .ic{width:70px} .flip .b b{font-size:20px} .flip .b span{font-size:14px;color:var(--muted)}
/* L3 */
.deckwrap{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:18px;align-items:center}
@media(max-width:720px){.deckwrap{grid-template-columns:1fr}}
.fcard{width:min(100%,240px);aspect-ratio:55/80;margin:0 auto;border:3px solid var(--ink);background:#fff;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;text-align:center;padding:14px}
.fcard .lbl{position:absolute;left:0;top:0;background:var(--ink);color:var(--yellow);font-weight:900;font-size:13px;padding:1px 8px}
.fcard .ic{width:110px} .fcard b{font-size:22px;line-height:1.3}
.fcard .cnt{position:absolute;right:8px;top:4px;font-family:var(--en);font-weight:700;font-size:13px}
.fcard.ans-a{background:var(--paper-2)} .fcard.ans-b{background:var(--yellow)}
.pockets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pockets .btn{padding:18px 10px;font-size:clamp(20px,4.5vw,26px);display:flex;flex-direction:column;align-items:center;gap:2px}
.pockets .btn small{font-size:13px;font-weight:700}
.pockets .pa{background:var(--paper-2)} .pockets .pb{background:var(--yellow)}
.tally{display:flex;gap:10px;font-weight:700;font-size:14px}.tally span{border:2px solid var(--ink);padding:1px 10px;background:#fff}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* L4 */
.temple{width:min(100%,560px);margin:0 auto;display:flex;flex-direction:column;align-items:center}
.ped{width:100%;height:70px;background:var(--ink);clip-path:polygon(50% 0,100% 100%,0 100%);position:relative}
.ped::after{content:"";position:absolute;inset:4px 6px 3px;background:var(--yellow);clip-path:polygon(50% 0,100% 100%,0 100%)}
.ped span{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-weight:900;font-size:20px;z-index:1}
.lint{width:94%;height:14px;background:#fff;border:2.5px solid var(--ink)}
.cols{width:86%;display:flex;justify-content:space-between;height:clamp(170px,36vw,230px)}
.slot{width:24%;border:2.5px dashed var(--grey);border-top:none;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-weight:900;font-size:clamp(14px,3.2vw,19px);color:var(--grey);letter-spacing:.05em}
.slot.fill{background:#fff;border:2.5px solid var(--ink);border-top:none;color:var(--ink);animation:drop .35s ease-out}
.base{width:100%;min-height:46px;border:2.5px dashed var(--grey);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--grey);font-size:clamp(15px,3.4vw,20px);text-align:center;padding:4px}
.base.fill{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20400%2060%22%20preserveAspectRatio%3D%22none%22%3E%3Cdefs%3E%3Cpattern%20id%3D%22d%22%20width%3D%226%22%20height%3D%226%22%20patternUnits%3D%22userSpaceOnUse%22%3E%3Ccircle%20cx%3D%223%22%20cy%3D%223%22%20r%3D%221.1%22%20fill%3D%22%23231815%22%20fill-opacity%3D%22.35%22/%3E%3C/pattern%3E%3C/defs%3E%0A%3Cpath%20d%3D%22M6%2010%20L40%203%20L120%206%20L190%202%20L260%205%20L330%202%20L394%208%20L397%2030%20L395%2052%20L330%2057%20L250%2055%20L170%2058%20L90%2055%20L20%2057%20L3%2048%20L5%2028%20Z%22%20fill%3D%22%23bcb39c%22%20stroke%3D%22%23231815%22%20stroke-width%3D%223%22%20vector-effect%3D%22non-scaling-stroke%22%20stroke-linejoin%3D%22round%22/%3E%0A%3Cpath%20d%3D%22M260%205%20L330%202%20L394%208%20L397%2030%20L395%2052%20L330%2057%20L300%2030%20Z%22%20fill%3D%22url%28%23d%29%22/%3E%0A%3Cpath%20d%3D%22M6%2010%20L40%203%20L120%206%20L110%2014%20L30%2016%20Z%22%20fill%3D%22%23e6ddcf%22%20opacity%3D%22.8%22/%3E%0A%3Cg%20fill%3D%22none%22%20stroke%3D%22%23231815%22%20stroke-width%3D%221.6%22%20vector-effect%3D%22non-scaling-stroke%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M70%2055%20l8%20-12%20l-4%20-8%22/%3E%3Cpath%20d%3D%22M215%203%20l-6%2010%20l7%206%22/%3E%3Cpath%20d%3D%22M350%2057%20l-10%20-14%20l6%20-9%22/%3E%3C/g%3E%3C/svg%3E") 0 0/100% 100% no-repeat;color:var(--ink);border:none;min-height:58px;animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-18px);opacity:0}}
.pieces{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.piece{font:inherit;font-weight:900;font-size:16px;border:2.5px solid var(--ink);background:#fff;padding:8px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.piece.used{display:none}
.hint{font-size:14px;color:var(--muted);text-align:center;margin:0}
/* L5 */
.band{display:flex;align-items:center;justify-content:space-between;gap:8px;border:3px solid var(--ink);background:#fff;padding:10px 14px;font-weight:900;font-size:clamp(16px,3.8vw,22px);flex-wrap:wrap}
.band .r{color:var(--red)} .band .mid{background:var(--yellow);border:2.5px solid var(--ink);padding:2px 12px;display:inline-flex;gap:6px;align-items:center}
.band .mid .ic{width:24px;display:inline-block}
.stamp{align-self:center;background:var(--red);color:var(--paper-2);border:3px solid var(--ink);font-weight:900;font-size:clamp(22px,5vw,32px);padding:10px 24px;transform:rotate(-3deg);text-align:center;line-height:1.3;box-shadow:6px 6px 0 var(--ink)}
textarea{width:100%;min-height:90px;font:inherit;border:2.5px solid var(--ink);padding:10px;background:#fff;resize:vertical}
.cert{border:3px double var(--ink);background:#fff;padding:14px;text-align:center}
.cert b{font-size:20px} .cert p{margin:6px 0 0;white-space:pre-wrap}
footer{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;border-top:2px solid var(--ink);padding-top:8px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}

:root{--round:"Huninn","jf-openhuninn","Noto Sans TC",sans-serif}
h1,h2,h3,.stamp,.titleblock h1{font-family:var(--round);font-weight:400!important;letter-spacing:.06em}
.panel h2 small{font-family:var(--f);font-weight:700}
.tour{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700;font-size:14px}
.tour b{font-weight:900;margin-right:2px}
.tour a{color:var(--ink);text-decoration:none;border:2px solid var(--ink);background:var(--paper-2);padding:1px 10px;display:inline-flex;gap:4px;align-items:center}
.tour a.cur{background:var(--ink);color:var(--yellow)}
.tour a.ok::after{content:"✓";color:var(--red);font-weight:900}
.tour a.cur.ok::after{color:var(--yellow)}
.topnav{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.ic{display:block}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{font:inherit;color:inherit;border:3px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--ink);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.tile .ic{width:clamp(48px,12vw,72px)}
.tile b{font-size:clamp(17px,4vw,20px);line-height:1.3}
.tile small{font-size:13px;color:var(--muted);line-height:1.4}
.tile.on{background:var(--yellow)} .tile.done{background:var(--paper-2);box-shadow:none;cursor:default}
.tile:disabled{cursor:default}
.tile:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.def{background:var(--yellow);border:3px solid var(--ink);padding:14px 16px;font-weight:700;font-size:clamp(16px,3.8vw,19px);margin:0}
.def b{color:var(--red)}
.endcard{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.endcard .stamp{margin:6px 0}
.substep{font-family:var(--en);font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--muted)}

.topnav .tour a{cursor:pointer}
.quest{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--ink);padding:10px 14px;box-shadow:4px 4px 0 var(--ink)}
.quest .ic{width:54px;flex:none} .quest b{color:var(--red)} .quest small{display:block;color:var(--muted);font-size:13px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.qgrid .tile b{font-size:17px}
.fmtrow{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:16px;align-items:center}
@media(max-width:620px){.fmtrow{grid-template-columns:1fr}}
.bigcard{border:3px solid var(--ink);background:#fff;box-shadow:5px 5px 0 var(--ink);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.bigcard .ic{width:96px} .bigcard b{font-size:20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opts .btn{text-align:left}
.opts .btn.right{background:var(--yellow)} .opts .btn.wrong{background:#f4d0cc;text-decoration:line-through}
.spec{display:grid;gap:12px}
.spec fieldset{border:2.5px solid var(--ink);background:#fff;padding:10px 12px;margin:0}
.spec legend{font-weight:900;padding:0 6px;background:var(--paper-2)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg .btn{font-size:15px;padding:6px 14px}
.seg .btn.on{background:var(--ink);color:var(--yellow)}
.apply{border:3px solid var(--ink);background:var(--yellow);padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:5px 5px 0 var(--ink)}
.apply .ic{width:58px;flex:none} .apply p{margin:0;font-weight:700} .apply b{color:var(--red)}
.apply .tagk{display:inline-block;background:var(--ink);color:var(--yellow);font-weight:900;padding:0 8px;margin-bottom:4px;letter-spacing:.08em}
/* 模擬 A+ */
.sim{border:3px solid var(--ink);background:#fff;box-shadow:6px 6px 0 var(--ink);overflow:hidden}
.sim .bar{display:flex;gap:8px;align-items:center;background:var(--ink);color:#fff;padding:6px 10px;font-size:13px;font-weight:700}
.sim .bar i{width:10px;height:10px;border-radius:50%;background:var(--red);display:inline-block}
.sim .bar i+i{background:var(--yellow)} .sim .bar span{margin-left:6px;background:#fff;color:var(--ink);padding:1px 10px;border-radius:10px;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sim .hd{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:2.5px solid var(--ink);background:var(--paper-2)}
.sim .hd b{font-family:var(--round);font-weight:400;font-size:20px}
.sim .hd .who{margin-left:auto;font-size:13px;font-weight:700}
.sim .hd .cartn{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:14px;border:2px solid var(--ink);padding:0 8px;background:#fff}
.sim .hd .cartn .ic{width:22px}
.sim .bd{padding:14px;display:flex;flex-direction:column;gap:12px;min-height:220px}
.sim .demo{font-size:12px;color:var(--red);font-weight:900;letter-spacing:.06em}
.sbox{display:flex;gap:8px} .sbox input{flex:1;min-width:0;font:inherit;font-size:16px;border:2.5px solid var(--ink);padding:6px 10px}
.kws{display:flex;flex-wrap:wrap;gap:8px} .kws button{font:inherit;font-size:14px;font-weight:700;border:2px dashed var(--ink);background:var(--paper-2);padding:2px 10px;cursor:pointer}
.res{display:flex;flex-direction:column;gap:8px}
.res .r{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;border:2px solid var(--ink);padding:8px;background:var(--paper-2)}
.res .r.mine{background:#fffbd6}
.res .r .ic{width:44px} .res .r b{display:block;line-height:1.35} .res .r small{color:var(--muted);font-size:12.5px}
.res .r .btn{font-size:14px;padding:4px 10px;white-space:nowrap}
.form{display:grid;gap:10px}
.form label{font-weight:700;display:flex;gap:8px;align-items:center}
.form .ck{display:flex;flex-wrap:wrap;gap:12px}
.form select{font:inherit;border:2.5px solid var(--ink);padding:6px;background:#fff}
.sends{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:560px){.sends{grid-template-columns:1fr}}
.sends .tile{flex-direction:row;text-align:left;align-items:center}
.sends .tile .ic{width:44px;flex:none}
.sends .tile em{font-style:normal;background:var(--red);color:#fff;font-size:12px;padding:0 6px;margin-left:4px}
.receipt{border:3px dashed var(--ink);background:var(--paper-2);padding:12px 14px;font-size:15px}
.receipt b{color:var(--red)}
.order{display:flex;flex-direction:column;gap:8px;counter-reset:o}
.order .slot{border:2.5px dashed var(--ink);padding:6px 12px;min-height:40px;font-weight:900;background:#fff;display:flex;align-items:center;gap:10px}
.order .slot::before{counter-increment:o;content:counter(o);width:26px;height:26px;border-radius:50%;background:var(--grey);color:#fff;display:grid;place-items:center;font-family:var(--en);font-size:14px;flex:none}
.order .slot.on{border-style:solid;background:var(--yellow)} .order .slot.on::before{background:var(--red)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.check{margin:0;padding-left:1.4em} .check li{margin:4px 0}
/* 問答 */
.qcard{border:3px solid var(--ink);background:#fff;padding:14px;box-shadow:5px 5px 0 var(--ink)}
.qcard .qn{font-family:var(--en);font-weight:700;color:var(--red);font-size:13px;letter-spacing:.1em}
.qcard p{margin:4px 0 0;font-weight:900;font-size:clamp(17px,4vw,21px);line-height:1.45}
.desk{border:3px solid var(--ink);background:#2a2420;color:#f7f3e8;padding:14px;box-shadow:5px 5px 0 var(--ink)}
.desk .file{background:#efe1c4;color:var(--ink);padding:10px 12px;border:2px solid var(--ink);font-family:serif;transform:rotate(-1deg);margin:8px 0}
.desk .file s{background:var(--ink);color:var(--ink)}
/* 拉霸 */
.slot3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.reel{border:3px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--ink);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:150px;justify-content:center}
.reel .ic{width:clamp(48px,12vw,70px)} .reel b{font-size:clamp(15px,3.6vw,19px);line-height:1.3} .reel small{font-size:12px;color:var(--muted)}
.reel.spin .ic,.reel.spin b{animation:roll .12s linear infinite}
@keyframes roll{0%{transform:translateY(-6px);opacity:.4}100%{transform:translateY(6px);opacity:1}}
.reel.lock{background:var(--yellow)}
.plan img{width:100%;max-width:640px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);display:block;margin:0 auto}
.pass{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pass span{width:64px;height:64px;border-radius:50%;border:3px dashed var(--grey);display:grid;place-items:center;font-weight:900;font-size:13px;color:var(--grey);text-align:center;line-height:1.2}
.pass span.on{border:3px solid var(--red);color:var(--red);transform:rotate(-8deg);background:#fff}

   coach('done',`掃描完成！你的<b>${MQ.a}</b>有了數位分身，從「靜態庫藏」變成可以「動態展演」的知識資產。`,'good');
   $('#scan').disabled=true;
   $('#l1end').innerHTML=applyCard(`永久保存的國家檔案，原則上以 <b>TIFF（不壓縮）或 JPEG（壓縮品質 75% 以上）、全彩、300 DPI</b> 儲存。數位化之後，經過個人資料去識別化的國家檔案影像，有些可以直接在<b>國家檔案資訊網（A+）</b>線上看到。`)+nextBtn(2);
   bindNext();done(1);};}
 show();}

// 第 2 關 分身之重
function L2(){const used=new Set();let cur=0;const sc=D.why;
 coach('idle','數位化到底有什麼好處？每個狀況，選一個數位化幫上忙的地方。');
 function show(){const s=sc[cur];
  ST.innerHTML=`<h2><small>第 2 關　${cur+1} / ${sc.length}</small>這時候，數位化幫上什麼忙？</h2>
  <div class="fmtrow"><div class="bigcard">${ic(s.ic,90)}<b style="font-size:17px">${s.s.replace('{a}',MQ.a)}</b></div>
  <div class="opts">${D.whyA.map((a,k)=>`<button class="btn" data-a="${k}" ${used.has(k)?'disabled':''}>${a}</button>`).join('')}</div></div>`;
  $$('[data-a]').forEach(b=>b.onclick=()=>{if(+b.dataset.a!==s.a){b.classList.add('wrong');shake(b);coach('miss','好像不是這個，再想想這個狀況最怕什麼？','bad');return;}
   b.classList.add('right');used.add(s.a);coach('good',`沒錯！<b>${D.whyA[s.a]}</b>。`,'good');
   setTimeout(()=>{cur++;cur<sc.length?show():end();},1000);});}
 function end(){coach('done','四個重要性全找到了！數位分身讓原件安心休息，大家也能用得更方便。','good');
  ST.innerHTML=`<h2><small>第 2 關</small>數位化的重要性</h2><ol class="check">${D.whyA.map(a=>`<li><b>${a}</b></li>`).join('')}</ol>`+
  applyCard(`所以申請國家檔案時，通常先提供<b>數位複製品</b>給你看，原件就能好好留在庫房。你的<b>${MQ.a}</b>也是這樣！`)+nextBtn(3,'下一關：親手申請 ▶');bindNext();done(2);}
 show();}

// 第 3 關 發光之路（模擬 A+）
function L3(){let login=false,cart=0,step=0;APP={items:[],send:''};
 const kw=MQ.kw;
 function frame(inner,addr){return `<div class="sim"><div class="bar"><i></i><i></i><span>${addr||'aa.archives.gov.tw'}　（模擬練習畫面）</span></div>
  <div class="hd"><b>國家檔案資訊網 A+</b><span class="who">${login?'● 已登入會員':'未登入'}</span><span class="cartn">${D.ic.cart.replace('<svg','<svg class="ic" style="width:22px"')}${cart}</span></div>
  <div class="bd"><span class="demo">※ 這是練習用的模擬畫面，搜尋結果是示意，不是真的檔案目錄。</span>${inner}</div></div>`;}
 function h(n,t){return `<h2><small>第 3 關・步驟 ${n} / 5</small>${t}</h2>`;}
 function s1(){coach('idle',`申請檔案只要五個步驟！第一步：<b>查詢檔案</b>。點一個關鍵字，幫你的「${MQ.q}」找檔案。`);
  ST.innerHTML=h(1,'查詢檔案')+frame(`<div class="sbox"><input id="kw" placeholder="輸入關鍵字" aria-label="關鍵字"><button class="btn k" id="go">查詢</button></div>
   <div class="kws">${kw.map(k=>`<button>${k}</button>`).join('')}</div><div class="res" id="res"></div>`);
  $$('.kws button').forEach(b=>b.onclick=()=>{$('#kw').value=b.textContent;});
  $('#go').onclick=()=>{const v=$('#kw').value.trim();if(!v){coach('miss','先點一個關鍵字，或自己打一個！','bad');return;}
   const R=[{n:`${MQ.a}（與「${v}」相關）`,t:MQ.t,ic:MQ.ic,mine:1},{n:`「${v}」相關會議紀錄`,t:'紙質',ic:'doc'},{n:`「${v}」相關照片`,t:'攝影',ic:'photo'}];
   $('#res').innerHTML=`<small>找到 ${R.length} 筆（示意）</small>`+R.map((r,i)=>`<div class="r ${r.mine?'mine':''}"><span class="ic">${D.qic[r.ic]||D.ic[r.ic]}</span><div><b>${r.n}</b><small>${r.t}類・國家檔案・檔號（示意）</small></div><button class="btn y" data-c="${i}">＋檔案車</button></div>`).join('');
   coach('good',`找到了！有一筆就是你的<b>${MQ.a}</b>。按「＋檔案車」把它加進去。`,'good');
   $$('[data-c]').forEach(b=>b.onclick=()=>{if(!login){s2(+b.dataset.c);return;}});};}
 function s2(pick){coach('idle','咦？要加入檔案車，得先<b>登入會員</b>。這就是第二步！');
  ST.innerHTML=h(2,'登入會員')+frame(`<p style="margin:0;font-weight:700">請選擇登入方式：</p><div class="seg"><button class="btn" data-l="1">會員帳號登入</button><button class="btn" data-l="2">自然人憑證登入</button></div>
   <p class="hint" style="text-align:left">第一次用要先免費註冊會員。</p>`,'aa.archives.gov.tw/login');
  $$('[data-l]').forEach(b=>b.onclick=()=>{login=true;coach('good','登入成功！現在可以把檔案加進檔案車了。','good');s3(pick);});}
 function s3(){ST.innerHTML=h(3,'加入我的檔案車')+frame(`<div class="res">
   <div class="r mine"><span class="ic">${D.qic[MQ.ic]}</span><div><b>${MQ.a}</b><small>${MQ.t}類・國家檔案・檔號（示意）</small></div><button class="btn y" id="add">＋檔案車</button></div></div>`);
  coach('idle',`按「＋檔案車」，把你的<b>${MQ.a}</b>放進檔案車。想申請好幾份，也可以一起放進去。`);
  $('#add').onclick=()=>{cart=1;coach('good','加入檔案車了！右上角的數字變成 1。接下來去填申請書。','good');s4();};}
 function s4(){ST.innerHTML=h(4,'填寫國家檔案應用申請書')+frame(`<div class="form">
   <div><b>我的檔案車</b>：${MQ.a}（1 筆）</div>
   <div><b>申請項目</b>（可以複選）<div class="ck">${['閱覽','抄錄','複製'].map(x=>`<label><input type="checkbox" value="${x}">${x}</label>`).join('')}</div></div>
   <label>使用目的 <select id="use"><option value="">請選擇</option><option>學校作業、報告</option><option>家族或地方尋根</option><option>創作、設計</option><option>學術研究</option></select></label>
   <label><input type="checkbox" id="elig">我是中華民國國民或持有中華民國護照</label>
   <button class="btn k" id="fill">填好了</button></div>`,'aa.archives.gov.tw/apply');
  coach('idle','第四步：<b>填寫申請書</b>。想親眼看選「閱覽」，想抄下來選「抄錄」，想帶一份回家選「複製」。');
  $('#fill').onclick=()=>{const it=$$('.ck input:checked').map(x=>x.value);
   if(!it.length){coach('miss','至少要勾一個申請項目喔！','bad');return;}
   if(!$('#use').value){coach('miss','選一下你要用來做什麼。','bad');return;}
   if(!$('#elig').checked){coach('miss','申請資格要確認一下：只要是中華民國國民或護照持有者，都可以申請！','bad');return;}
   APP.items=it;APP.use=$('#use').value;coach('good','申請書填好了！最後一步：<b>提出申請</b>。','good');s5();};}
 function s5(){ST.innerHTML=h(5,'提出申請：選一種送件方式')+`<div class="sends">${D.send.map(s=>`<button class="tile" data-s="${s.k}">${ic(s.ic,44)}<div><b>${s.n}${s.fast?'<em>最快</em>':''}</b><small>${s.d}</small></div></button>`).join('')}</div>`;
  coach('idle','送件方式有四種，都可以！你想用哪一種？');
  $$('[data-s]').forEach(b=>b.onclick=()=>{const s=D.send.find(x=>x.k===b.dataset.s);APP.send=s.n;
   coach(s.fast?'done':'good',s.fast?'用自然人憑證在 A+ 線上直接送出，是<b>最快</b>的方式！':`用「${s.n}」也可以！如果有自然人憑證，線上送出會最快。`,'good');
   ST.innerHTML=h(5,'申請送出！')+`<div class="receipt">📮 申請已送出（模擬）<br>申請檔案：<b>${MQ.a}</b><br>申請項目：<b>${APP.items.join('、')}</b>　使用目的：${APP.use}<br>送件方式：<b>${APP.send}</b></div>`+
    `<p class="text">申請送出後，檔案局會審核，再通知你來閱覽、抄錄，或提供複製品。如果檔案涉及個人隱私，會把那部分<b>遮蔽</b>後再提供。</p>`+
    `<div class="row"><button class="btn big" id="toOrder">複習五步驟 ▶</button></div>`;
   $('#toOrder').onclick=order;});}
 function order(){let k=0;const pool=shuffle(D.steps.map((s,i)=>({s,i})));
  ST.innerHTML=`<h2><small>第 3 關・複習</small>申請五步驟，照順序點一次！</h2><div class="order">${D.steps.map((_,i)=>`<div class="slot" id="o${i}"></div>`).join('')}</div>
   <div class="pool">${pool.map(p=>`<button class="btn" data-i="${p.i}">${p.s}</button>`).join('')}</div><div id="l3end"></div>`;
  coach('idle','剛剛走過的五個步驟，你記得順序嗎？');
  $$('.pool .btn').forEach(b=>b.onclick=()=>{if(+b.dataset.i!==k){shake(b);coach('miss','順序不對喔，想想剛剛先做了什麼？','bad');return;}
   const sl=$('#o'+k);sl.textContent=D.steps[k];sl.classList.add('on');b.hidden=true;k++;
   if(k===5){coach('done','五步驟全對！申請國家檔案真的很簡單。','good');
    $('#l3end').innerHTML=applyCard(`現在就能試！真的申請要準備：<br>① 到 A+ 免費註冊會員　② 有自然人憑證，線上送出最快　③ 也可以親送、郵寄或傳真、電子郵件送件。<br><a class="btn k" style="text-decoration:none;display:inline-block;margin-top:8px" href="${D.AA}" target="_blank" rel="noopener">前往國家檔案資訊網 A+ ↗</a>`)+nextBtn(4);
    bindNext();done(3);}else coach('good',`第 ${k} 步：${D.steps[k-1]}！`,'good');});}
 s1();}

// 第 4 關 經營法則（問答＋編輯台）
function L4(){const qs=D.quiz.slice();let i=0,first=0,tried=false;
 function show(){const q=qs[i];tried=false;
  ST.innerHTML=`<h2><small>第 4 關　${i+1} / ${qs.length+1}　${q.g==='4-5'?'數位化的應用':'使用檔案的素養'}</small>${q.g==='4-5'?'數位化知識，你了解多少？':'多方比對，慎思明辨'}</h2>
  <div class="qcard"><span class="qn">Q${i+1}</span><p>${q.q}</p></div>
  <div class="opts">${q.o.map((o,k)=>`<button class="btn" data-k="${k}">${'ABCD'[k]}. ${o}</button>`).join('')}</div><div id="qx"></div>`;
  coach('idle',i===0?'用檔案之前，先練練功！答錯也沒關係，會告訴你為什麼。':'下一題！');
  $$('[data-k]').forEach(b=>b.onclick=()=>{if(+b.dataset.k!==q.a){b.classList.add('wrong');b.disabled=true;tried=true;shake(b);coach('miss','再想一下！','bad');return;}
   if(!tried)first++;b.classList.add('right');$$('[data-k]').forEach(x=>x.disabled=true);coach('good',q.e,'good');
   $('#qx').innerHTML=`<div class="row"><button class="btn big" id="qn">${i<qs.length-1?'下一題 ▶':'最後一題：編輯台 ▶'}</button></div>`;
   $('#qn').onclick=()=>{i++;i<qs.length?show():desk();};});}
 function desk(){ST.innerHTML=`<h2><small>第 4 關　${qs.length+1} / ${qs.length+1}　編輯台挑戰</small>這篇報導，標題要怎麼下？</h2>
  <div class="desk"><b>你是校刊小編。</b>同學在 A+ 找到一份威權時期的政治檔案，上面寫著某位老先生年輕時「思想有問題」。
  <div class="file">……該員<s>某某某</s>思想有問題，應予注意……</div>同學說：「這個標題一定爆紅！」</div>
  <div class="opts">${['「驚！某某某原來是壞人」','「檔案揭密：某某某的黑歷史大公開」','先比對其他檔案、訪談與時代背景，再說明這份紀錄是在什麼體制下寫成的'].map((o,k)=>`<button class="btn" data-k="${k}">${'ABC'[k]}. ${o}</button>`).join('')}</div><div id="qx"></div>`;
  coach('idle','檔案寫的，就一定是真的嗎？');
  $$('[data-k]').forEach(b=>b.onclick=()=>{if(+b.dataset.k!==2){b.classList.add('wrong');b.disabled=true;shake(b);coach('miss','這樣可能把歷史傷痕變成獵巫或八卦。檔案只是當時的一種觀點喔！','bad');return;}
   b.classList.add('right');$$('[data-k]').forEach(x=>x.disabled=true);
   coach('done',`好編輯！威權時期的檔案常是為了管控而寫，要<b>多方比對、慎思明辨</b>。你一次就答對 ${first} / ${qs.length} 題！`,'good');
   $('#qx').innerHTML=applyCard('使用檔案時，要衡量它產生的<b>背景、脈絡、時序和完整性</b>，結合多元觀點與資料，避免用單一資料下結論。這就是「檔案素養」。')+nextBtn(5);bindNext();done(4);});}
 show();}

// 第 5 關 無限可能（拉霸＋我的檔案應用計畫）
function L5(){const TH=Object.keys(D.themes);let th=TH[0],wk=D.themes[th][0],spun=0,lock=false;
 coach('idle',`最後一關！你的<b>${MQ.a}</b>可以變成什麼？拉一下拉霸，看看它的斜槓人生。`);
 ST.innerHTML=`<h2><small>第 5 關</small>檔案 × 用途 × 作品</h2>
  <div class="slot3"><div class="reel lock">${ic(MQ.ic,70)}<b>${MQ.a}</b><small>我的檔案選手</small></div>
  <div class="reel" id="r2"></div><div class="reel" id="r3"></div></div>
  <div class="row" style="justify-content:center"><button class="btn big" id="spin">拉一下！</button><button class="btn" id="keep" hidden>就是它了 ✓</button></div><div id="l5end"></div>`;
 function paint(){$('#r2').innerHTML=`${ic('th_'+th,70)}<b>${th}</b><small>用途</small>`;$('#r3').innerHTML=`<span class="ic" style="width:70px">${D.ic.star}</span><b>${wk}</b><small>作品</small>`;}
 paint();
 $('#spin').onclick=()=>{if(lock)return;lock=true;$('#r2').classList.add('spin');$('#r3').classList.add('spin');let t=0;
  const iv=setInterval(()=>{th=TH[Math.floor(Math.random()*TH.length)];wk=D.themes[th][Math.floor(Math.random()*3)];paint();if(++t>14){clearInterval(iv);$('#r2').classList.remove('spin');$('#r3').classList.remove('spin');lock=false;spun++;
   coach('good',`你的<b>${MQ.a}</b>斜槓成「<b>${th}</b>」：做成<b>${wk}</b>！喜歡就按「就是它了」，不喜歡再拉一次。`,'good');$('#keep').hidden=false;$('#spin').textContent='再拉一次';}},80);};
 $('#keep').onclick=()=>{$('#spin').hidden=true;$('#keep').hidden=true;finish(th,wk);};}
function finish(th,wk){const plan={q:MQ.q,a:MQ.a,t:MQ.t,kw:MQ.kw.join('、'),items:(APP.items&&APP.items.length?APP.items:['閱覽','複製']).join('、'),send:APP.send||'自然人憑證線上送出',th,wk};
 QUEST.plan(plan);QUEST.stamp(4);done(5);if(window.ARCHI)ARCHI.log('finish',{th});
 const url=drawPlan(plan);const st=QUEST.stamps();
 coach('done','完成！這是你的「我的檔案應用計畫」。照著做，就能把檔案真的申請出來！','good');
 $('#l5end').innerHTML=`<div class="plan"><img src="${url}" alt="我的檔案應用計畫"></div><p class="hint">手機長按圖片可以存起來；電腦按右鍵另存。</p>
  <h3 style="text-align:center;margin:6px 0 0">四箱護照</h3><div class="pass">${['徵集','保存','修護','應用'].map((n,k)=>`<span class="${st[k]?'on':''}">箱${'一二三四'[k]}<br>${n}</span>`).join('')}</div>
  <p class="text">每一箱都在講你這份<b>${MQ.a}</b>的一段人生：箱一它被<b>徵集</b>入選，箱二它在庫房被<b>保存</b>，箱三它受損時被<b>修護</b>，箱四你親手把它<b>申請出來應用</b>。到其他箱子掃 QR，把護照蓋滿吧！</p>
  <div class="row" style="justify-content:center"><a class="btn big" style="text-decoration:none" href="${D.AA}" target="_blank" rel="noopener">現在就去 A+ 查查看 ↗</a><a class="btn" style="text-decoration:none" href="${D.ROOT}">回線上任務首頁</a></div>`;}
function drawPlan(p){const W=1600,H=1000,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 x.fillStyle='#efe9d8';x.fillRect(0,0,W,H);x.fillStyle='rgba(27,23,20,.08)';for(let i=0;i<W;i+=14)for(let j=0;j<H;j+=14){x.beginPath();x.arc(i,j,1.6,0,7);x.fill();}
 x.lineWidth=10;x.strokeStyle='#1b1714';x.strokeRect(30,30,W-60,H-60);
 x.fillStyle='#f3e03b';x.fillRect(70,70,760,96);x.fillStyle='#1b1714';x.font='900 64px "Huninn","Noto Sans TC",sans-serif';x.textBaseline='middle';x.fillText('我的檔案應用計畫',90,120);
 x.fillStyle='#1b1714';x.fillRect(70,180,560,44);x.fillStyle='#f3e03b';x.font='700 26px "IBM Plex Sans",sans-serif';x.fillText('MY NATIONAL ARCHIVES PLAN',86,203);
 x.fillStyle='#c8322a';x.fillRect(W-330,70,250,70);x.fillStyle='#f7f3e8';x.font='900 34px "Noto Sans TC",sans-serif';x.fillText('BOX 4 應用',W-310,106);
 const rows=[['我的問題',p.q],['我的檔案選手',`${p.a}（${p.t}類）`],['查詢關鍵字',p.kw],['申請五步驟','查詢檔案 › 登入會員 › 加入我的檔案車 › 填寫申請書 › 提出申請'],['申請項目',p.items],['送件方式',p.send],['我想做成',`${p.th}：${p.wk}`]];
 let y=280;rows.forEach(([k,v],i)=>{x.fillStyle=i===6?'#c8322a':'#1b1714';x.fillRect(70,y-30,230,60);x.fillStyle=i===6?'#f7f3e8':'#f3e03b';x.font='900 30px "Noto Sans TC",sans-serif';x.fillText(k,88,y);
  x.fillStyle='#1b1714';x.font=(i===6?'900 40px':'700 32px')+' "Noto Sans TC",sans-serif';let t=v;while(x.measureText(t).width>W-420&&t.length>4)t=t.slice(0,-2);if(t!==v)t+='…';x.fillText(t,320,y);
  x.fillStyle='rgba(27,23,20,.25)';x.fillRect(70,y+40,W-140,2);y+=86;});
 x.fillStyle='#1b1714';x.font='700 26px "Noto Sans TC",sans-serif';x.fillText('國家檔案資訊網 A+　aa.archives.gov.tw　｜　只要是中華民國國民或護照持有者，都可以申請！',70,H-70);
 return c.toDataURL('image/png');}

drawQuest();tour4();
const h0=location.hash.slice(1);if(HASH[h0]&&QUEST.get())go(HASH[h0]);
else if(HASH[h0]){$('#startBtn').onclick=()=>go(HASH[h0]);}

</script>
