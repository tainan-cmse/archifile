<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>選手村入住大作戰｜箱二 檔案入住選手村</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Sans:wght@600;700&display=swap">
<style>
:root{--paper:#efe9d8;--paper-2:#f7f3e8;--ink:#1b1714;--muted:#5e5549;--red:#c8322a;--dred:#6c291f;--yellow:#f3e03b;--grey:#bcb39c;--blue:#3a8fd6;
--f:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--en:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background-color:var(--paper);background-image:radial-gradient(rgba(27,23,20,.10) 1.1px,transparent 1.5px);background-size:7px 7px;color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.65;
padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.tohome{align-self:flex-start;display:inline-flex;font-weight:700;font-size:14px;color:var(--ink);text-decoration:none;border:2.5px solid var(--ink);background:var(--paper-2);padding:4px 12px;box-shadow:3px 3px 0 var(--ink)}
.titleblock{display:inline-flex;flex-direction:column;align-self:flex-start;gap:2px}
.titleblock h1{margin:0;font-weight:900;font-size:clamp(30px,7vw,56px);line-height:1.1;letter-spacing:.05em;background:linear-gradient(var(--yellow),var(--yellow)) no-repeat .3em .25em/calc(100% - .2em) calc(100% - .1em);padding-right:.2em}
.en{font-family:var(--en);font-weight:700;font-size:14px;letter-spacing:.04em}
.kicker{font-family:var(--en);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.tag{display:inline-block;background:var(--ink);color:var(--yellow);font-weight:900;padding:1px 10px;letter-spacing:.1em;font-size:14px}
.btn{font:inherit;font-weight:900;font-size:16px;border:2.5px solid var(--ink);background:var(--paper-2);color:var(--ink);padding:8px 18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.big{font-size:20px;padding:10px 26px;background:var(--red);color:var(--paper-2)}
.btn.y{background:var(--yellow)} .btn.k{background:var(--ink);color:var(--yellow)}
.btn:focus-visible,.flip:focus-visible,.piece:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn:disabled{opacity:.4;cursor:default}
.intro{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:26px;align-items:center}
@media(max-width:720px){.intro{grid-template-columns:1fr}.intro .cube{max-width:260px;margin:0 auto}}
.intro p{margin:0;max-width:34em}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{border:2px solid var(--ink);padding:1px 10px;font-weight:700;font-size:14px;background:var(--paper-2)}
.copy{display:flex;flex-direction:column;gap:14px;min-width:0}
header.bar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;border-bottom:3px solid var(--ink);padding-bottom:10px}
.prog{margin-left:auto;display:flex;gap:6px}
.prog i{width:34px;height:10px;border:2px solid var(--ink);background:var(--paper-2)}
.prog i.on{background:var(--red)} .prog i.done{background:var(--ink)}
.panel{background:var(--paper-2);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{margin:0;font-weight:900;font-size:clamp(22px,4.5vw,30px);letter-spacing:.05em}
.panel h2 small{display:block;font-size:14px;color:var(--red);letter-spacing:.06em}
.coach{display:grid;grid-template-columns:clamp(80px,20vw,112px) minmax(0,1fr);gap:12px;align-items:end}
.coach img{width:100%;height:auto;display:block;transform-origin:50% 100%}
.coach img.hop{animation:hop .5s ease-out}
@keyframes hop{30%{transform:translateY(-14px) rotate(-4deg)}60%{transform:translateY(0) rotate(2deg)}}
.msg{position:relative;align-self:center;min-height:3.2em;background:var(--paper-2);border:2.5px solid var(--ink);border-left-width:10px;padding:10px 14px}
.msg::before{content:"";position:absolute;left:-17px;bottom:16px;border:8px solid transparent;border-right:9px solid var(--ink)}
.msg.bad{border-left-color:var(--red)} .msg.good{border-left-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.text{margin:0;background:#fff;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:10px 12px}
.text b{color:var(--red)}
/* L1 */
.guess{background:var(--yellow);border:3px solid var(--ink);padding:18px;display:flex;gap:16px;align-items:center}
.guess .ic{width:clamp(48px,12vw,70px);flex:none} .guess p{margin:0;font-weight:900;font-size:clamp(19px,4.6vw,30px);line-height:1.35}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-weight:900;font-size:clamp(18px,4vw,24px)}
.eq .no{color:var(--red);font-size:1.4em} .eq .ic{width:36px;display:inline-block;vertical-align:middle}
/* L2 */
.flips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:720px){.flips{grid-template-columns:1fr}}
.flip{position:relative;min-height:170px;border:3px solid var(--ink);background:var(--paper-2);box-shadow:4px 4px 0 var(--ink);cursor:pointer;padding:0;font:inherit;color:inherit;perspective:900px;text-align:left}
.flip .f,.flip .b{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;gap:8px;backface-visibility:hidden;transition:transform .45s}
.flip .b{transform:rotateY(180deg);background:#fff;align-items:center;text-align:center;justify-content:center}
.flip.open .f{transform:rotateY(-180deg)} .flip.open .b{transform:rotateY(0)}
.flip .qn{width:40px;height:40px;border-radius:50%;background:var(--red);color:var(--paper-2);font-family:var(--en);font-weight:700;font-size:18px;display:grid;place-items:center}
.flip .f p{margin:0;font-weight:900;font-size:18px;line-height:1.45}
.flip .f em{margin-top:auto;font-style:normal;font-weight:900;color:var(--red);font-size:14px;text-align:right}
.flip .b .ic{width:70px} .flip .b b{font-size:20px} .flip .b span{font-size:14px;color:var(--muted)}
/* L3 */
.deckwrap{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:18px;align-items:center}
@media(max-width:720px){.deckwrap{grid-template-columns:1fr}}
.fcard{width:min(100%,240px);aspect-ratio:55/80;margin:0 auto;border:3px solid var(--ink);background:#fff;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;text-align:center;padding:14px}
.fcard .lbl{position:absolute;left:0;top:0;background:var(--ink);color:var(--yellow);font-weight:900;font-size:13px;padding:1px 8px}
.fcard .ic{width:110px} .fcard b{font-size:22px;line-height:1.3}
.fcard .cnt{position:absolute;right:8px;top:4px;font-family:var(--en);font-weight:700;font-size:13px}
.fcard.ans-a{background:var(--paper-2)} .fcard.ans-b{background:var(--yellow)}
.pockets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pockets .btn{padding:18px 10px;font-size:clamp(20px,4.5vw,26px);display:flex;flex-direction:column;align-items:center;gap:2px}
.pockets .btn small{font-size:13px;font-weight:700}
.pockets .pa{background:var(--paper-2)} .pockets .pb{background:var(--yellow)}
.tally{display:flex;gap:10px;font-weight:700;font-size:14px}.tally span{border:2px solid var(--ink);padding:1px 10px;background:#fff}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* L4 */
.temple{width:min(100%,560px);margin:0 auto;display:flex;flex-direction:column;align-items:center}
.ped{width:100%;height:70px;background:var(--ink);clip-path:polygon(50% 0,100% 100%,0 100%);position:relative}
.ped::after{content:"";position:absolute;inset:4px 6px 3px;background:var(--yellow);clip-path:polygon(50% 0,100% 100%,0 100%)}
.ped span{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-weight:900;font-size:20px;z-index:1}
.lint{width:94%;height:14px;background:#fff;border:2.5px solid var(--ink)}
.cols{width:86%;display:flex;justify-content:space-between;height:clamp(170px,36vw,230px)}
.slot{width:24%;border:2.5px dashed var(--grey);border-top:none;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-weight:900;font-size:clamp(14px,3.2vw,19px);color:var(--grey);letter-spacing:.05em}
.slot.fill{background:#fff;border:2.5px solid var(--ink);border-top:none;color:var(--ink);animation:drop .35s ease-out}
.base{width:100%;min-height:46px;border:2.5px dashed var(--grey);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--grey);font-size:clamp(15px,3.4vw,20px);text-align:center;padding:4px}
.base.fill{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20400%2060%22%20preserveAspectRatio%3D%22none%22%3E%3Cdefs%3E%3Cpattern%20id%3D%22d%22%20width%3D%226%22%20height%3D%226%22%20patternUnits%3D%22userSpaceOnUse%22%3E%3Ccircle%20cx%3D%223%22%20cy%3D%223%22%20r%3D%221.1%22%20fill%3D%22%23231815%22%20fill-opacity%3D%22.35%22/%3E%3C/pattern%3E%3C/defs%3E%0A%3Cpath%20d%3D%22M6%2010%20L40%203%20L120%206%20L190%202%20L260%205%20L330%202%20L394%208%20L397%2030%20L395%2052%20L330%2057%20L250%2055%20L170%2058%20L90%2055%20L20%2057%20L3%2048%20L5%2028%20Z%22%20fill%3D%22%23bcb39c%22%20stroke%3D%22%23231815%22%20stroke-width%3D%223%22%20vector-effect%3D%22non-scaling-stroke%22%20stroke-linejoin%3D%22round%22/%3E%0A%3Cpath%20d%3D%22M260%205%20L330%202%20L394%208%20L397%2030%20L395%2052%20L330%2057%20L300%2030%20Z%22%20fill%3D%22url%28%23d%29%22/%3E%0A%3Cpath%20d%3D%22M6%2010%20L40%203%20L120%206%20L110%2014%20L30%2016%20Z%22%20fill%3D%22%23e6ddcf%22%20opacity%3D%22.8%22/%3E%0A%3Cg%20fill%3D%22none%22%20stroke%3D%22%23231815%22%20stroke-width%3D%221.6%22%20vector-effect%3D%22non-scaling-stroke%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M70%2055%20l8%20-12%20l-4%20-8%22/%3E%3Cpath%20d%3D%22M215%203%20l-6%2010%20l7%206%22/%3E%3Cpath%20d%3D%22M350%2057%20l-10%20-14%20l6%20-9%22/%3E%3C/g%3E%3C/svg%3E") 0 0/100% 100% no-repeat;color:var(--ink);border:none;min-height:58px;animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-18px);opacity:0}}
.pieces{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.piece{font:inherit;font-weight:900;font-size:16px;border:2.5px solid var(--ink);background:#fff;padding:8px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.piece.used{display:none}
.hint{font-size:14px;color:var(--muted);text-align:center;margin:0}
/* L5 */
.band{display:flex;align-items:center;justify-content:space-between;gap:8px;border:3px solid var(--ink);background:#fff;padding:10px 14px;font-weight:900;font-size:clamp(16px,3.8vw,22px);flex-wrap:wrap}
.band .r{color:var(--red)} .band .mid{background:var(--yellow);border:2.5px solid var(--ink);padding:2px 12px;display:inline-flex;gap:6px;align-items:center}
.band .mid .ic{width:24px;display:inline-block}
.stamp{align-self:center;background:var(--red);color:var(--paper-2);border:3px solid var(--ink);font-weight:900;font-size:clamp(22px,5vw,32px);padding:10px 24px;transform:rotate(-3deg);text-align:center;line-height:1.3;box-shadow:6px 6px 0 var(--ink)}
textarea{width:100%;min-height:90px;font:inherit;border:2.5px solid var(--ink);padding:10px;background:#fff;resize:vertical}
.cert{border:3px double var(--ink);background:#fff;padding:14px;text-align:center}
.cert b{font-size:20px} .cert p{margin:6px 0 0;white-space:pre-wrap}
footer{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;border-top:2px solid var(--ink);padding-top:8px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}

:root{--round:"Huninn","jf-openhuninn","Noto Sans TC",sans-serif}
h1,h2,h3,.stamp,.titleblock h1{font-family:var(--round);font-weight:400!important;letter-spacing:.06em}
.panel h2 small{font-family:var(--f);font-weight:700}
.tour{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:700;font-size:14px}
.tour b{font-weight:900;margin-right:2px}
.tour a{color:var(--ink);text-decoration:none;border:2px solid var(--ink);background:var(--paper-2);padding:1px 10px;display:inline-flex;gap:4px;align-items:center}
.tour a.cur{background:var(--ink);color:var(--yellow)}
.tour a.ok::after{content:"✓";color:var(--red);font-weight:900}
.tour a.cur.ok::after{color:var(--yellow)}
.topnav{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.ic{display:block}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{font:inherit;color:inherit;border:3px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--ink);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
.tile .ic{width:clamp(48px,12vw,72px)}
.tile b{font-size:clamp(17px,4vw,20px);line-height:1.3}
.tile small{font-size:13px;color:var(--muted);line-height:1.4}
.tile.on{background:var(--yellow)} .tile.done{background:var(--paper-2);box-shadow:none;cursor:default}
.tile:disabled{cursor:default}
.tile:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.def{background:var(--yellow);border:3px solid var(--ink);padding:14px 16px;font-weight:700;font-size:clamp(16px,3.8vw,19px);margin:0}
.def b{color:var(--red)}
.endcard{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.endcard .stamp{margin:6px 0}
.substep{font-family:var(--en);font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--muted)}

.quest{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--ink);padding:10px 14px;box-shadow:4px 4px 0 var(--ink)}
.quest .ic{width:54px;flex:none} .quest b{color:var(--red)} .quest small{display:block;color:var(--muted);font-size:13px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.qgrid .tile b{font-size:17px}
.apply{border:3px solid var(--ink);background:var(--yellow);padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:5px 5px 0 var(--ink)}
.apply .ic{width:58px;flex:none} .apply p{margin:0;font-weight:700} .apply b{color:var(--red)}
.apply .tagk{display:inline-block;background:var(--ink);color:var(--yellow);font-weight:900;padding:0 8px;margin-bottom:4px;letter-spacing:.08em}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.order{display:flex;flex-direction:column;gap:8px;counter-reset:o}
.order .slot{border:2.5px dashed var(--ink);padding:6px 12px;min-height:40px;font-weight:900;background:#fff;display:flex;align-items:center;gap:10px}
.order .slot::before{counter-increment:o;content:counter(o);width:26px;height:26px;border-radius:50%;background:var(--grey);color:#fff;display:grid;place-items:center;font-family:var(--en);font-size:14px;flex:none}
.order .cslot.on{border-style:solid;background:var(--yellow)} .order .slot.on::before{background:var(--red)}
/* 冷凍 */
.fz{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px;align-items:center}
@media(max-width:560px){.fz{grid-template-columns:1fr}}
.fzbox{position:relative;border:3px solid var(--ink);background:#dfeefa;box-shadow:5px 5px 0 var(--ink);padding:14px;text-align:center}
.fzbox .ic{width:110px;margin:0 auto}
.fzbox .temp{font-family:var(--en);font-weight:700;font-size:40px;line-height:1}
.fzbox.cold{background:#9fd0f5}
.fzbox .bugs{position:absolute;inset:0;pointer-events:none}
.fzbox .bugs span{position:absolute;width:26px;animation:crawl 1.2s ease-in-out infinite alternate}
@keyframes crawl{to{transform:translate(6px,-4px) rotate(14deg)}}
.slider{display:flex;flex-direction:column;gap:6px}
.slider input{width:100%;accent-color:var(--red);height:30px}
.slider .scale{display:flex;justify-content:space-between;font-family:var(--en);font-weight:700;font-size:13px}
.days{display:flex;flex-wrap:wrap;gap:4px}
.days i{width:30px;height:30px;border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font-family:var(--en);font-weight:700;font-size:13px;background:#fff}
.days i.c{background:#9fd0f5} .days i.w{background:#ffd7a8}
.crate{position:relative;width:min(100%,360px);aspect-ratio:3/2;margin:0 auto;border:3px solid var(--ink);background:#d8b98a;box-shadow:5px 5px 0 var(--ink)}
.crate .bag{position:absolute;inset:8px;border:3px dashed #7aa7c7;background:rgba(255,255,255,.35);display:grid;place-items:center;font-weight:900;cursor:pointer}
.crate .dead{position:absolute;width:34px;cursor:pointer;padding:0;border:0;background:none;transform:rotate(180deg);filter:grayscale(.6)}
/* 穿搭 */
.dress{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:560px){.dress{grid-template-columns:1fr}}
.doll{border:3px solid var(--ink);background:#fff;box-shadow:5px 5px 0 var(--ink);padding:8px}
.doll .cwrap{position:relative;width:100%;max-width:260px;margin:0 auto}.doll .cwrap img,.doll .cwrap svg{display:block;width:100%;height:auto}.doll .cwrap .ly{position:absolute;left:0;top:0}
.doll .ly{opacity:0;transition:opacity .4s} .doll .ly.on{opacity:1}
.wear{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.wear .tile{padding:8px} .wear .tile .ic{width:54px} .wear .tile b{font-size:15px}
.wear .tile.no{background:#f4d0cc;text-decoration:line-through;box-shadow:none}
.wear .tile.yes{background:var(--yellow)}
/* 櫃子 */
.cabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cab{border:3px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--ink);padding:10px 8px;display:flex;flex-direction:column;gap:6px;min-height:150px;cursor:pointer;font:inherit;color:inherit;text-align:center}
.cab b{font-size:clamp(14px,3.4vw,17px)} .cab small{font-size:12px;color:var(--muted);line-height:1.35}
.cab .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center} .cab .in .ic{width:30px}
.cab.hl{background:#fffbd6}
.cabs.v{grid-template-columns:1fr}.cabs.v .cab{min-height:0;text-align:left}
.cab.ok{background:#e3f4d8} .cab.bad{background:#f4d0cc}
.cab .st{font-weight:900;font-size:13px}
.fpool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fpool .tile{width:96px;padding:6px} .fpool .tile .ic{width:44px} .fpool .tile b{font-size:14px}
.fpool .tile.sel{background:var(--yellow);transform:translateY(-4px)}
.dial{display:grid;grid-template-columns:auto minmax(0,1fr) 64px;gap:4px 8px;align-items:center;font-size:13px;font-weight:700;text-align:left}
.dial input{width:100%;accent-color:var(--red)}
.mcards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.mcard{width:150px;border:3px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--ink);padding:8px;font:inherit;color:inherit;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:2px}
.mcard b{font-size:16px} .mcard small{font-size:12px;line-height:1.35}
.mcard.sel{background:var(--yellow);transform:translateY(-4px)} .mcard.no{background:#f4d0cc;text-decoration:line-through;box-shadow:none;cursor:default}
.cslot{display:block;align-self:stretch;writing-mode:horizontal-tb;width:auto;height:auto;border:3px dashed var(--ink);padding:6px 10px;font-weight:900;font-size:14px;background:#fff}
.cslot.on{border-style:solid}
.dcell{display:flex;flex-direction:column;gap:2px}
.band{position:relative;height:10px;margin:0 9px;background:#e6e1d8;border:1.5px solid var(--ink)}
.band i{position:absolute;top:0;bottom:0;background:#6cbf5a}
.dial .tip{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--red);min-height:1.2em}
.mnemo{background:var(--yellow);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px 12px;font-weight:900;text-align:center;font-size:clamp(14px,3.6vw,19px)} .dial output{font-family:var(--en);font-weight:700;text-align:right}
/* 場區 */
.bldg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:4px solid var(--ink);background:#fff;max-width:520px;margin:0 auto;position:relative}
.bldg::before{content:"";position:absolute;left:-4px;right:-4px;top:-34px;height:30px;background:linear-gradient(transparent 40%,var(--ink) 40%) ;clip-path:polygon(0 100%,50% 0,100% 100%)}
.room{font:inherit;color:inherit;border:2px solid var(--ink);background:var(--paper-2);min-height:74px;padding:6px 30px 6px 8px;cursor:pointer;font-weight:700;font-size:clamp(13px,3.4vw,16px);line-height:1.35;position:relative}
.room.w2{grid-column:span 2} .room.fixed{background:#ddd5c2;cursor:default;color:var(--muted)}
.room.x{background:#f4d0cc;color:var(--muted)} .room.x::after{content:"✕";position:absolute;right:8px;top:2px;color:var(--red);font-size:26px;font-weight:900}
.room .why{display:block;font-size:12px;color:var(--red)}
.room.best{background:var(--yellow)} .room.best::after{content:"★";position:absolute;right:8px;top:2px;font-size:26px;color:var(--red)}
.room.b1{background:#c9c0ab}
.water{grid-column:span 2;height:0;z-index:2;border-top:3px dashed var(--blue);position:relative}
.water span{position:absolute;z-index:2;left:6px;top:2px;background:#fff;padding:0 4px;font-size:12px;font-weight:900;color:var(--blue)}
.ground{grid-column:span 2;height:6px;background:var(--ink)}
.clues{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 10px;border:3px solid var(--ink);background:#fff;padding:10px;box-shadow:4px 4px 0 var(--ink);font-size:13px;font-weight:700}
@media(max-width:560px){.clues{grid-template-columns:repeat(2,minmax(0,1fr))}}
.clues span{display:flex;gap:5px;align-items:center;opacity:.55;line-height:1.25} .clues span.on{opacity:1}
.clues b{flex:none;width:21px;height:21px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--en);font-size:12px;border:2px solid var(--ink)}
.mode{display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;padding:8px 12px;font-weight:700;font-size:14px;line-height:1.4}
.mode .tg{background:var(--yellow);color:var(--ink);font-weight:900;padding:2px 8px;font-size:16px;white-space:nowrap}
.mode svg{width:46px;flex:none}
.draw{position:relative;max-width:560px;margin:0 auto;border:3px solid var(--ink);background:#fffaf0;box-shadow:5px 5px 0 var(--ink)}
.draw img{display:block;width:100%;height:auto;pointer-events:none}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;font:inherit;display:grid;place-items:center}
.hot:hover,.hot:focus-visible{background:rgba(243,224,59,.35);outline:2px dashed var(--ink)}
.hot.fx{cursor:default;background:rgba(188,179,156,.35)} .hot.fx:hover{outline:0}
.hot.x{background:rgba(200,50,42,.16);cursor:default} .hot.x::after{content:"✕";color:var(--red);font-size:clamp(22px,6vw,40px);font-weight:900;line-height:1}
.hot.ok{background:rgba(243,224,59,.8);outline:3px solid var(--ink)} .hot.ok::after{content:"✓";color:var(--red);font-size:clamp(26px,7vw,48px);font-weight:900;line-height:1}
.step2{display:flex;gap:6px;justify-content:center;font-weight:900;font-size:13px}
.step2 span{border:2px solid var(--ink);padding:2px 10px;background:#fff} .step2 span.on{background:var(--yellow)} .step2 span.ok{background:#e3f4d8}
/* 走珠 */
.maze{position:relative;max-width:640px;margin:0 auto;width:100%}
.maze canvas{display:block;width:100%;height:auto;border:4px solid var(--ink);background:#e9e2cf;touch-action:none;box-shadow:6px 6px 0 var(--ink)}
.got{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media(max-width:560px){.got{grid-template-columns:repeat(4,minmax(0,1fr))}}
.got div{border:2px solid var(--ink);background:#fff;padding:4px;text-align:center;font-size:11px;font-weight:700;line-height:1.25;opacity:.25}
.got div.on{opacity:1;background:#fffbd6}
.eqpop{border:3px solid var(--ink);background:#fff;padding:10px;display:flex;gap:12px;align-items:center;box-shadow:4px 4px 0 var(--ink);min-height:84px}
.eqpop .e{width:90px;flex:none}
.chip{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);font-size:12px;font-weight:900;text-align:center;line-height:18px;margin-right:2px}
.pass{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pass span{width:64px;height:64px;border-radius:50%;border:3px dashed var(--grey);display:grid;place-items:center;font-weight:900;font-size:13px;color:var(--grey);text-align:center;line-height:1.2}
.pass span.on{border:3px solid var(--red);color:var(--red);transform:rotate(-8deg);background:#fff}
.cert{border:4px double var(--ink);background:#fffaf0;padding:18px;text-align:center;max-width:520px;margin:0 auto;box-shadow:6px 6px 0 var(--ink)}
.cert h3{margin:0;font-family:var(--round);font-weight:400;font-size:30px;letter-spacing:.1em}
.cert .ic{width:80px;margin:6px auto}

</style>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function coach(kind,html,cls){const im=$('#coachImg');im.src=D.ch[kind]||D.ch.idle;im.classList.remove('hop');void im.offsetWidth;if(kind==='good'||kind==='done')im.classList.add('hop');
 const m=$('#msg');m.innerHTML=html;m.className='msg'+(cls?' '+cls:'');}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
function tour(){$$('.tour a').forEach(a=>{if(store('box1_lv'+a.dataset.lv)==='1')a.classList.add('ok');});}

const LV={1:['全身淨化','2-3 冷凍除蟲室','FREEZING PEST CONTROL'],2:['專業穿搭','2-2 工作人員著裝法','DRESS CODE'],3:['溫濕獨控','2-1 檔案典藏櫃','REQUIREMENTS FOR THE PREMIUM ARCHIVAL SPACE'],4:['住所細說','2-4・2-5 庫房模樣與設備','THE ARCHIVES VILLAGE']};
const HASH={'2-3':1,'2-2':2,'2-1':3,'2-4':4,'2-5':4};
const HN={1:'2-3',2:'2-2',3:'2-1',4:'2-5'};
const ST=$('#stage');let MQ=null;
function ic(k,w){return `<span class="ic" style="width:${w||56}px">${D.ic[k]||D.qic[k]||''}</span>`;}
function questTile(){const q=MQ;return q?`<span class="ic">${D.qic[q.ic]}</span><div><small>我的檔案任務</small>${q.q}<br>我的檔案選手：<b>${q.a}</b>（${q.t}類）</div>`:'';}
function drawQuest(){const box=$('#questBox');MQ=window.QUEST&&QUEST.get();
 if(MQ){box.innerHTML=`<div class="quest">${questTile()}</div><button class="btn" id="chgQ" style="margin-top:8px;font-size:14px">換一個任務</button>`;$('#chgQ').onclick=()=>{QUEST.set('');drawQuest();};}
 else{box.innerHTML=`<p style="margin:0;font-weight:900">先選一個你想知道的問題，我們幫你配一份能回答它的檔案：</p><div class="qgrid">${QUEST.list.map(q=>`<button class="tile" data-q="${q.k}"><span class="ic">${D.qic[q.ic]}</span><b>${q.q}</b><small>你的檔案選手：${q.a}</small></button>`).join('')}</div>`;
  $$('#questBox [data-q]').forEach(b=>b.onclick=()=>{QUEST.set(b.dataset.q);drawQuest();});}
 $('#startBtn').disabled=!MQ;}
function applyCard(t){return `<div class="apply">${ic('cart',58)}<div><span class="tagk">想看嗎？申請它！</span><p>${t}</p></div></div>`;}

function bindNext(){$$('[data-n]').forEach(b=>b.onclick=()=>go(+b.dataset.n));}

 $$('.pool .btn').forEach(b=>b.onclick=()=>{if(+b.dataset.i!==k){shake(b);coach('miss','順序不對！想想看：沒有包好就放進去，會發生什麼事？','bad');return;}

 function dial(){let d=0,warm=0;

   <div class="row"><button class="btn k" id="day" disabled>冷凍一天 ❄</button><button class="btn" id="warm" disabled>拿出來回溫</button></div></div></div><div id="l1x"></div>`;

function L3(){let files=D.files.slice();const mine=files.findIndex(f=>(MQ.t==='攝影'&&f.c==='photo'&&f.n==='照片')||(MQ.t==='電子媒體'&&f.n==='錄影帶')||(MQ.ic==='map'&&f.n==='地圖')||(MQ.ic==='blue'&&f.n==='藍晒圖')||(MQ.ic==='doc'&&f.n==='公文'));

 ST.innerHTML=`<h2><small>第 4 關・之一　最佳場區選拔賽</small>${S.q} ${S.name}：${S.ask}</h2>
  <div class="step2"><span class="${k===0?'on':'ok'}">Q1 立面圖・選樓層</span><span class="${k===1?'on':''}">Q2 平面圖・選空間</span></div>
  <div class="mode">${MODEIC[S.mode]}<span class="tg">${S.mode}</span><span>${S.how}。</span></div>
  <div class="clues">${D.clue.map((c,i)=>`<span id="cl${i+1}"><b>${i+1}</b>${c}</span>`).join('')}</div>
  <div class="draw"><img src="${S.img}" alt="${S.name}">${S.rooms.map((r,i)=>`<button class="hot ${r.fixed?'fx':''}" data-h="${i}" aria-label="${r.n}" style="left:${r.r[0]/10}%;top:${r.r[1]/S.h*100}%;width:${(r.r[2]-r.r[0])/10}%;height:${(r.r[3]-r.r[1])/S.h*100}%"></button>`).join('')}</div>
  <div id="l4x"></div>`;
 $$('[data-h]').forEach(b=>b.onclick=()=>{const r=S.rooms[+b.dataset.h];if(b.classList.contains('x')||b.classList.contains('ok'))return;
  if(r.fixed){coach('idle',`這是<b>${r.n}</b>，它本身就不能放檔案。看看它旁邊、上下的房間吧！`);return;}
  if(r.bad){const sib=r.grp?$$('[data-h]').filter(e=>S.rooms[+e.dataset.h].grp===r.grp):[b];sib.forEach(e=>e.classList.add('x'));
   r.bad.forEach(n=>{used.add(n);$('#cl'+n).classList.add('on');});
   const why=r.bad.length?r.bad.map(n=>`線索 ${n}「${D.clue[n-1]}」`).join('、'):r.why;
   coach('miss',`<b>${r.n}</b>不適合！${why}。`,'bad');shake(b);return;}
  b.classList.add('ok');$$('[data-h]').forEach(e=>e.disabled=true);
  coach('done',`答對了！${S.done}`,'good');
  $('#l4x').innerHTML=k===0?`<div class="row"><button class="btn big" id="toQ2">下一題：Q2 平面圖 ▶</button></div>`:`<div class="row"><button class="btn big" id="toMaze">走進庫房，認識設備 ▶</button></div>`;
  if(k===0)$('#toQ2').onclick=()=>siteQ(1);else $('#toMaze').onclick=maze;});}

function maze(){const W=360,H=240,got=new Set();
 const shelves=[];for(let i=0;i<7;i++)shelves.push({x:56+i*36,y:56,w:12,h:128});
 const holes=[[24,24],[180,22],[80,120],[300,24],[340,110],[24,214],[24,120],[224,150],[180,222],[340,24],[340,214],[152,86]];
 coach('idle','這就是你的選手村庫房！<b>傾斜手機</b>（或在畫面上按住、拖向想去的方向）讓珠子滾到 12 個洞，認識庫房的必備設備。');
 ST.innerHTML=`<h2><small>第 4 關・之二　庫房設備走珠</small>住所細說：找到 12 項必備設備</h2>
  <div class="maze"><canvas id="cv" width="${W*2}" height="${H*2}" aria-label="庫房平面走珠"></canvas></div>
  <div class="row" style="justify-content:center"><button class="btn y" id="tilt">開啟手機傾斜</button><span class="hint">電腦可用方向鍵</span></div>
  <div class="eqpop" id="pop"><span>珠子滾進洞裡，就會出現設備卡。</span></div><div class="got" id="got">${D.eq.map(e=>`<div id="g${e.n}"><div>${e.svg}</div>${e.n}</div>`).join('')}</div><div id="l4end"></div>`;
 const cv=$('#cv'),cx=cv.getContext('2d');cx.scale(2,2);
 let bx=300,by=180,vx=0,vy=0,ax=0,ay=0,pt=null,keys={},run=true,last=performance.now();
 function onOri(e){const g=e.gamma||0,b=e.beta||0;const L=(screen.orientation&&Math.abs(screen.orientation.angle)===90);ax=(L?b*(screen.orientation.angle>0?-1:1):g)/30;ay=(L?g*(screen.orientation.angle>0?1:-1):b-20)/30;}
 $('#tilt').onclick=async()=>{try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw 0;}
  window.addEventListener('deviceorientation',onOri);$('#tilt').textContent='傾斜已開啟 ✓';$('#tilt').disabled=true;coach('good','傾斜手機試試看！','good');}catch(e){coach('miss','這台裝置不能用傾斜，改用手指按住畫面拖動吧！','bad');}};
 function pos(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
 cv.onpointerdown=e=>{pt=pos(e);cv.setPointerCapture(e.pointerId);};cv.onpointermove=e=>{if(pt)pt=pos(e);};cv.onpointerup=cv.onpointercancel=()=>{pt=null;};
 const kd=e=>{if(e.key.startsWith('Arrow')){keys[e.key]=e.type==='keydown';e.preventDefault();}};window.addEventListener('keydown',kd);window.addEventListener('keyup',kd);
 stopMaze=()=>{run=false;window.removeEventListener('deviceorientation',onOri);window.removeEventListener('keydown',kd);window.removeEventListener('keyup',kd);};
 const CHC={'天':['#f3e03b','#231815'],'地':['#231815','#f3e03b'],'壁':['#c8322a','#f4ecd6']};
 function draw(){cx.clearRect(0,0,W,H);cx.fillStyle='#e9e2cf';cx.fillRect(0,0,W,H);
  cx.strokeStyle='rgba(27,23,20,.08)';for(let i=0;i<W;i+=12){cx.beginPath();cx.moveTo(i,0);cx.lineTo(i,H);cx.stroke();}
  shelves.forEach(s=>{cx.fillStyle='#bcb39c';cx.fillRect(s.x,s.y,s.w,s.h);cx.strokeStyle='#231815';cx.lineWidth=2;cx.strokeRect(s.x,s.y,s.w,s.h);for(let y=s.y+16;y<s.y+s.h;y+=16){cx.beginPath();cx.moveTo(s.x,y);cx.lineTo(s.x+s.w,y);cx.stroke();}});
  cx.fillStyle='#c8322a';cx.fillRect(166,H-4,28,4);
  holes.forEach((h,i)=>{const n=D.eq[i].n,on=got.has(n);cx.beginPath();cx.arc(h[0],h[1],9.5,0,7);cx.fillStyle=on?'#f3e03b':'#5e5549';cx.fill();cx.lineWidth=2;cx.strokeStyle='#231815';cx.stroke();
   cx.fillStyle=on?'#231815':'#fff';cx.font='700 10px "IBM Plex Sans",sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(n,h[0],h[1]+.5);});
  cx.beginPath();cx.arc(bx,by,7,0,7);const g=cx.createRadialGradient(bx-2,by-2,1,bx,by,7);g.addColorStop(0,'#fff');g.addColorStop(1,'#8a8f96');cx.fillStyle=g;cx.fill();cx.strokeStyle='#231815';cx.lineWidth=1.5;cx.stroke();}
 function step(t){if(!run)return;const dt=Math.min(32,t-last)/16;last=t;
  let fx=ax,fy=ay;if(pt){const dx=pt[0]-bx,dy=pt[1]-by,d=Math.hypot(dx,dy)||1;fx=dx/d*Math.min(1,d/40);fy=dy/d*Math.min(1,d/40);}
  if(keys.ArrowLeft)fx=-1;if(keys.ArrowRight)fx=1;if(keys.ArrowUp)fy=-1;if(keys.ArrowDown)fy=1;
  fx=Math.max(-1.2,Math.min(1.2,fx));fy=Math.max(-1.2,Math.min(1.2,fy));
  if(pt){const dx=pt[0]-bx,dy=pt[1]-by,d=Math.hypot(dx,dy)||1,sp=Math.min(3,d/8);vx+=(dx/d*sp-vx)*.25*dt;vy+=(dy/d*sp-vy)*.25*dt;}else{vx=(vx+fx*.25*dt)*.96;vy=(vy+fy*.25*dt)*.96;}let nx=bx+vx*dt,ny=by+vy*dt;const r=7;
  if(nx<r){nx=r;vx*=-.4;}if(nx>W-r){nx=W-r;vx*=-.4;}if(ny<r){ny=r;vy*=-.4;}if(ny>H-r){ny=H-r;vy*=-.4;}
  shelves.forEach(s=>{const qx=Math.max(s.x,Math.min(nx,s.x+s.w)),qy=Math.max(s.y,Math.min(ny,s.y+s.h)),dx=nx-qx,dy=ny-qy;if(dx*dx+dy*dy<r*r){
   if(Math.abs(dx)>Math.abs(dy)){nx=qx+(dx>=0?r:-r);vx*=-.4;}else{ny=qy+(dy>=0?r:-r);vy*=-.4;}}});
  bx=nx;by=ny;
  holes.forEach((h,i)=>{const e=D.eq[i];if(got.has(e.n))return;if(Math.hypot(bx-h[0],by-h[1])<9){got.add(e.n);vx*=.2;vy*=.2;
   $('#g'+e.n).classList.add('on');$('#pop').innerHTML=`<span class="e">${e.svg}</span><div><b>${e.n}　${e.zh}</b><br>${[...e.c].map(c=>`<span class="chip" style="background:${CHC[c][0]};color:${CHC[c][1]}">${c}</span>`).join('')}<small>裝在${[...e.c].map(c=>({天:'天花板',地:'地面',壁:'牆壁'})[c]).join('、')}</small></div>`;
   coach('good',`找到第 ${got.size} 項：<b>${e.zh}</b>！`,'good');if(got.size===12)finish();}});
  draw();requestAnimationFrame(step);}
 window.__ball=()=>[bx,by,got.size];requestAnimationFrame(step);
 function finish(){run=false;if(stopMaze)stopMaze();QUEST.stamp(2);done(4);if(window.ARCHI)ARCHI.log('finish',{});const st=QUEST.stamps();
  coach('done',`12 項設備全找到！你的<b>${MQ.a}</b>正式入住五星級選手村。`,'good');
  $('#l4end').innerHTML=`<div class="cert">${ic('village',80)}<h3>選手村入住證</h3><p style="margin:6px 0">檔案選手：<b style="color:var(--red)">${MQ.a}</b>（${MQ.t}類）<br>已完成：低溫除蟲兩回合・專業著裝・專屬典藏櫃・最佳場區</p><div class="stamp" style="font-size:20px">入住完成</div></div>
   <h3 style="text-align:center;margin:10px 0 0">四箱護照</h3><div class="pass">${['徵集','保存','修護','應用'].map((n,k)=>`<span class="${st[k]?'on':''}">箱${'一二三四'[k]}<br>${n}</span>`).join('')}</div>`+
   applyCard(`選手村把原件保護得好好的，你就能放心申請使用它。下一步：到<b>箱四</b>學會申請五步驟，把你的<b>${MQ.a}</b>申請出來！`)+
   `<div class="row" style="justify-content:center"><a class="btn big" style="text-decoration:none" href="${D.ROOT}box4/">前往箱四：把檔案申請出來 ▶</a><a class="btn" style="text-decoration:none" href="${D.ROOT}">回線上任務首頁</a></div>`;}}

drawQuest();tour2();
const h0=location.hash.slice(1);if(HASH[h0]&&QUEST.get())go(HASH[h0]);
else if(HASH[h0]){$('#startBtn').onclick=()=>go(HASH[h0]);}

</script>
</body>
</html>
